# Display unit preferences
#
# Unit selectors are defined in packages/subdevices.yaml so they are always
# available to existing remote package configurations that already include the
# Settings sub-device package. This file is intentionally documentation-only.
#
# Current settings:
#   - Temperature Unit: Auto / °C / °F
#   - Distance Unit:    Auto / km / mi
#   - Speed Unit:       Auto / m/s / km/h / mph
#   - Pressure Unit:    Auto / hPa / inHg
#
# The selectors affect presentation on the wall panel only. Home Assistant's
# source values and units remain untouched. "Auto" means to keep the unit
# reported by Home Assistant.
