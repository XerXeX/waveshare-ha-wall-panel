# Shared icon registry compatibility package
#
# The runtime MDI -> image registry now lives entirely in the wall_panel
# component and is populated automatically from packages/icons.yaml.
#
# Home and Scene/Script pages query that registry directly and provide their own
# domain/page fallback icons when an inherited Home Assistant icon is missing.
#
# This package is intentionally kept as a no-op so existing remote package
# configurations that still include packages/icon_registry.yaml continue to work
# without needing a configuration change.
