# Icon registry bridge
#
# User-configured icons are registered by wall_panel code generation. Every icon
# in packages/icons.yaml is registered here as well so Home and Scene cards can
# inherit the entity's Material Design Icon directly from Home Assistant.

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            auto *panel = id(wall_panel_controller);
            panel->register_icon("mdi:account", id(icon_account));
