            height: 42
            min_value: 0
            max_value: 100
            value: 50
            bg_color: 0x343A44
            indicator:
              bg_color: 0x858B94
            knob:
              bg_color: 0xFFFFFF
            on_value:
              - lambda: |-
                  char text[16];
                  snprintf(text, sizeof(text), "%d%%", (int) x);
                  lv_label_set_text(id(cover_detail_percent), text);
            on_change:
              - lambda: |-
                  if (id(cover_slider_syncing))
                    return;
                  id(pending_cover_position) = (int) x;
                  id(cover_position_dirty) = true;

        - button:
            id: cover_detail_open_button
            x: 40
            y: 305
            width: 120
            height: 52
            bg_color: 0x343A44
            radius: 14
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  if (id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4)
                    id(wall_panel_controller).open_cover(id(active_cover_slot));
            widgets:
              - label:
                  id: cover_detail_open_label
                  align: CENTER
                  text: "UP"
                  text_font: ui_font_18
                  text_color: 0xFFFFFF

        - button:
            id: cover_detail_stop_button
            x: 180
            y: 305
            width: 120
            height: 52
            bg_color: 0x343A44
            radius: 14
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  if (id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4)
                    id(wall_panel_controller).stop_cover(id(active_cover_slot));
            widgets:
              - label:
                  align: CENTER
                  text: "STOP"
                  text_font: ui_font_18
                  text_color: 0xFFFFFF

        - button:
            id: cover_detail_close_button
            x: 320
            y: 305
            width: 120
            height: 52
            bg_color: 0x343A44
            radius: 14
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  if (id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4)
                    id(wall_panel_controller).close_cover(id(active_cover_slot));
            widgets:
              - label:
                  id: cover_detail_close_label
                  align: CENTER
                  text: "DOWN"
                  text_font: ui_font_18
                  text_color: 0xFFFFFF

interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &panel = *id(wall_panel_controller);
          const bool da = std::string(panel.get_language_option()) == "Danish";
          lv_label_set_text(id(blinds_page_title), panel.tr(esphome::wall_panel::TranslationKey::BLINDS));
          lv_label_set_text(id(cover_detail_open_label), da ? "OP" : "UP");
          lv_label_set_text(id(cover_detail_close_label), da ? "NED" : "DOWN");

          lv_obj_t *cards[4] = {
            id(cover_slot1_card), id(cover_slot2_card), id(cover_slot3_card), id(cover_slot4_card)
          };
          lv_obj_t *p0[4] = {
            id(cover_slot1_p0_button), id(cover_slot2_p0_button), id(cover_slot3_p0_button), id(cover_slot4_p0_button)
          };
          lv_obj_t *p25[4] = {
            id(cover_slot1_p25_button), id(cover_slot2_p25_button), id(cover_slot3_p25_button), id(cover_slot4_p25_button)
          };
          lv_obj_t *p50[4] = {
            id(cover_slot1_p50_button), id(cover_slot2_p50_button), id(cover_slot3_p50_button), id(cover_slot4_p50_button)
          };
          lv_obj_t *p75[4] = {
            id(cover_slot1_p75_button), id(cover_slot2_p75_button), id(cover_slot3_p75_button), id(cover_slot4_p75_button)
          };
          lv_obj_t *p100[4] = {
            id(cover_slot1_p100_button), id(cover_slot2_p100_button), id(cover_slot3_p100_button), id(cover_slot4_p100_button)
          };
          lv_obj_t *p0_labels[4] = {
            id(cover_slot1_p0_label), id(cover_slot2_p0_label), id(cover_slot3_p0_label), id(cover_slot4_p0_label)
          };
          lv_obj_t *p50_labels[4] = {
            id(cover_slot1_p50_label), id(cover_slot2_p50_label), id(cover_slot3_p50_label), id(cover_slot4_p50_label)
          };
          lv_obj_t *p100_labels[4] = {
            id(cover_slot1_p100_label), id(cover_slot2_p100_label), id(cover_slot3_p100_label), id(cover_slot4_p100_label)
          };
          const esphome::wall_panel::CoverSlotState *slots[4] = {
            &panel.get_cover_slot(1), &panel.get_cover_slot(2),
            &panel.get_cover_slot(3), &panel.get_cover_slot(4)
          };

          int visible_indices[4];
          int visible_count = 0;
          for (int i = 0; i < 4; i++) {
            if (slots[i]->configured)
              visible_indices[visible_count++] = i;
          }

          for (int rank = 0; rank < visible_count; rank++) {
            const int i = visible_indices[rank];
            const bool full_width = visible_count <= 2;
            const bool positioned = slots[i]->has_position;

            if (full_width) {
              lv_obj_set_pos(cards[i], 20, 72 + rank * 150);
              lv_obj_set_width(cards[i], 440);
            } else {
              lv_obj_set_pos(cards[i], rank % 2 == 0 ? 20 : 250, rank < 2 ? 72 : 222);
              lv_obj_set_width(cards[i], 210);
            }

            if (positioned) {
              lv_label_set_text(p0_labels[i], "0%");
              lv_label_set_text(p50_labels[i], "50%");
              lv_label_set_text(p100_labels[i], "100%");

              if (full_width) {
                lv_obj_clear_flag(p25[i], LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(p75[i], LV_OBJ_FLAG_HIDDEN);

                lv_obj_set_pos(p0[i], 14, 82);   lv_obj_set_width(p0[i], 76);
                lv_obj_set_pos(p25[i], 98, 82);  lv_obj_set_width(p25[i], 76);
                lv_obj_set_pos(p50[i], 182, 82); lv_obj_set_width(p50[i], 76);
                lv_obj_set_pos(p75[i], 266, 82); lv_obj_set_width(p75[i], 76);
                lv_obj_set_pos(p100[i], 350, 82); lv_obj_set_width(p100[i], 76);
              } else {
                lv_obj_add_flag(p25[i], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(p75[i], LV_OBJ_FLAG_HIDDEN);

                lv_obj_set_pos(p0[i], 10, 82);   lv_obj_set_width(p0[i], 58);
                lv_obj_set_pos(p50[i], 76, 82);  lv_obj_set_width(p50[i], 58);
                lv_obj_set_pos(p100[i], 142, 82); lv_obj_set_width(p100[i], 58);
              }
            } else {
              lv_obj_add_flag(p25[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(p75[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(p0_labels[i], da ? "OP" : "UP");
              lv_label_set_text(p50_labels[i], "STOP");
              lv_label_set_text(p100_labels[i], da ? "NED" : "DOWN");

              if (full_width) {
                lv_obj_set_pos(p0[i], 14, 82);   lv_obj_set_width(p0[i], 132);
                lv_obj_set_pos(p50[i], 154, 82); lv_obj_set_width(p50[i], 132);
                lv_obj_set_pos(p100[i], 294, 82); lv_obj_set_width(p100[i], 132);
              } else {
                lv_obj_set_pos(p0[i], 10, 82);   lv_obj_set_width(p0[i], 58);
                lv_obj_set_pos(p50[i], 76, 82);  lv_obj_set_width(p50[i], 58);
                lv_obj_set_pos(p100[i], 142, 82); lv_obj_set_width(p100[i], 58);
              }
            }
          }

          auto update_card = [da](lv_obj_t *card, lv_obj_t *name_label, lv_obj_t *state_label,
                                  const esphome::wall_panel::CoverSlotState &slot) {
            if (!slot.configured) {
              lv_obj_add_flag(card, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            lv_obj_clear_flag(card, LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(name_label, slot.name.c_str());

            if (!slot.available) {
              lv_label_set_text(state_label, da ? "Ikke tilgængelig" : "Unavailable");
              lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
              return;
            }

            char text[48];
            if (slot.state == "opening") {
              if (slot.has_position)
                snprintf(text, sizeof(text), "%s · %d%%", da ? "Åbner" : "Opening", slot.position_pct);
              else
                snprintf(text, sizeof(text), "%s", da ? "Åbner" : "Opening");
            } else if (slot.state == "closing") {
              if (slot.has_position)
                snprintf(text, sizeof(text), "%s · %d%%", da ? "Lukker" : "Closing", slot.position_pct);
              else
                snprintf(text, sizeof(text), "%s", da ? "Lukker" : "Closing");
            } else if (slot.has_position) {
              snprintf(text, sizeof(text), "%d%%", slot.position_pct);
            } else if (slot.state == "open") {
              snprintf(text, sizeof(text), "%s", da ? "Åben" : "Open");
            } else if (slot.state == "closed") {
              snprintf(text, sizeof(text), "%s", da ? "Lukket" : "Closed");
            } else {
              snprintf(text, sizeof(text), "%s", slot.state.c_str());
            }
            lv_label_set_text(state_label, text);
            lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
          };

          update_card(id(cover_slot1_card), id(cover_slot1_name_label), id(cover_slot1_state_label), panel.get_cover_slot(1));
          update_card(id(cover_slot2_card), id(cover_slot2_name_label), id(cover_slot2_state_label), panel.get_cover_slot(2));
          update_card(id(cover_slot3_card), id(cover_slot3_name_label), id(cover_slot3_state_label), panel.get_cover_slot(3));
          update_card(id(cover_slot4_card), id(cover_slot4_name_label), id(cover_slot4_state_label), panel.get_cover_slot(4));

          if (id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4 && !id(cover_position_dirty)) {
            const auto &slot = panel.get_cover_slot(id(active_cover_slot));
            lv_label_set_text(id(cover_detail_name), slot.name.c_str());

            if (slot.has_position) {
              id(cover_slider_syncing) = true;
              lv_slider_set_value(id(cover_detail_slider), slot.position_pct, LV_ANIM_OFF);
              id(cover_slider_syncing) = false;
              char text[16];
              snprintf(text, sizeof(text), "%d%%", slot.position_pct);
              lv_label_set_text(id(cover_detail_percent), text);
            }
          }

  - interval: 750ms
    then:
      - if:
          condition:
            lambda: return id(cover_position_dirty) && id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4;
          then:
            - lambda: |-
                id(wall_panel_controller).set_cover_position(id(active_cover_slot), id(pending_cover_position));
                id(cover_position_dirty) = false;
