# Configurable blinds page
#
# Each slot exposes a Name and Entity setting in Home Assistant. The selected
# entity should normally be a cover.* entity. The panel subscribes to state,
# current_position and supported_features dynamically.

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            const auto &slot1 = id(wall_panel_controller).get_cover_slot(1);
            const auto &slot2 = id(wall_panel_controller).get_cover_slot(2);
            const auto &slot3 = id(wall_panel_controller).get_cover_slot(3);
            const auto &slot4 = id(wall_panel_controller).get_cover_slot(4);

            id(cover_slot1_name).publish_state(slot1.name);
            id(cover_slot1_entity).publish_state(slot1.entity_id);
            id(cover_slot2_name).publish_state(slot2.name);
            id(cover_slot2_entity).publish_state(slot2.entity_id);
            id(cover_slot3_name).publish_state(slot3.name);
            id(cover_slot3_entity).publish_state(slot3.entity_id);
            id(cover_slot4_name).publish_state(slot4.name);
            id(cover_slot4_entity).publish_state(slot4.entity_id);

globals:
  - id: active_cover_slot
    type: int
    restore_value: false
    initial_value: '0'

  - id: pending_cover_position
    type: int
    restore_value: false
    initial_value: '0'

  - id: cover_position_dirty
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: cover_slider_syncing
    type: bool
    restore_value: false
    initial_value: 'false'

text:
  - platform: template
    id: cover_slot1_name
    name: "Blinds · Slot 1 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: "Blind 1"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_cover_name(1, x);
