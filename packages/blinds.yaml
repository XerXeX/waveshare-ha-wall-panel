lvgl:
  id: wall_panel_lvgl
  pages:
    - id: blinds_page
      bg_color: 0x101216
      widgets:
        - label:
            id: blinds_page_title
            x: 20
            y: 18
            text: "Blinds"
            text_font: ui_font_34
            text_color: 0xFFFFFF
        - obj:
            id: cover_slot1_card
            x: 20
            y: 72
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            pad_all: 0
            clickable: true
            scrollable: false
            hidden: true
            on_click:
              - if:
                  condition:
                    lambda: |-
                      const auto &slot = id(wall_panel_controller).get_cover_slot(1);
                      return slot.configured && slot.available && slot.has_position;
                  then:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_cover_slot(1);
                        id(active_cover_slot) = 1;
                        id(cover_position_dirty) = false;
                        const char *current_name = lv_label_get_text(id(cover_detail_name));
                        if (current_name == nullptr || std::strcmp(current_name, slot.name.c_str()) != 0)
                          lv_label_set_text(id(cover_detail_name), slot.name.c_str());
                        char text[16];
                        snprintf(text, sizeof(text), "%d%%", slot.position_pct);
                        const char *current_text = lv_label_get_text(id(cover_detail_percent));
                        if (current_text == nullptr || std::strcmp(current_text, text) != 0)
                          lv_label_set_text(id(cover_detail_percent), text);
                        if (lv_slider_get_value(id(cover_detail_slider)) != slot.position_pct) {
                          id(cover_slider_syncing) = true;
                          lv_slider_set_value(id(cover_detail_slider), slot.position_pct, LV_ANIM_OFF);
                          id(cover_slider_syncing) = false;
                        }
                    - lvgl.page.show: cover_detail_page
            widgets:
              - label:
                  id: cover_slot1_name_label
                  x: 14
                  y: 12
                  text: "Blind 1"
                  text_font: ui_font_22
                  text_color: 0xFFFFFF
              - label:
                  id: cover_slot1_state_label
                  x: 14
                  y: 45
                  text: "--"
                  text_font: ui_font_18
                  text_color: 0x858B94
              - image:
                  id: cover_slot1_icon
                  src: icon_blinds
                  align: TOP_RIGHT
                  x: -14
                  y: 10
                  image_recolor: 0xFFB300
                  image_recolor_opa: 100%
              - button:
                  id: cover_slot1_p0_button
                  x: 10
                  y: 82
                  width: 58
                  height: 42
                  bg_color: 0x343A44
                  radius: 12
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_cover_slot(1);
                        if (slot.has_position) id(wall_panel_controller).set_cover_position(1, 0);
                        else id(wall_panel_controller).open_cover(1);
                  widgets:
                    - label:
                        id: cover_slot1_p0_label
                        align: CENTER
                        text: "UP"
                        text_font: ui_font_18
                        text_color: 0xFFFFFF
              - button:
                  id: cover_slot1_p25_button
                  x: 94
                  y: 82
                  width: 76
                  height: 42
                  bg_color: 0x343A44
                  radius: 12
                  border_width: 0
                  hidden: true
                  on_click:
                    - script.execute: ui_click
