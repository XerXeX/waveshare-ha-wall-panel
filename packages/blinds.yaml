  top_layer:
    widgets:
      - obj:
          id: !extend bottom_nav
          widgets:
            - button:
                id: !extend nav_blinds_button
                widgets:
                  - image:
                      id: !extend nav_blinds_icon
                      src: icon_blinds
interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &panel = *id(wall_panel_controller);
          const bool da = std::string(panel.get_language_option()) == "Danish";

          auto set_text_if_changed = [](lv_obj_t *label, const char *text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || std::strcmp(current, text) != 0)
              lv_label_set_text(label, text);
          };
          auto set_hidden_if_changed = [](lv_obj_t *obj, bool hidden) {
            const bool current = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (current == hidden)
              return;
            if (hidden)
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto set_geometry_if_changed = [](lv_obj_t *obj, int x, int y, int width) {
            if (lv_obj_get_x(obj) != x || lv_obj_get_y(obj) != y)
              lv_obj_set_pos(obj, x, y);
            if (lv_obj_get_width(obj) != width)
              lv_obj_set_width(obj, width);
          };

          set_text_if_changed(id(blinds_page_title), panel.tr(esphome::wall_panel::TranslationKey::BLINDS));
          set_text_if_changed(id(cover_detail_open_label), da ? "OP" : "UP");
          set_text_if_changed(id(cover_detail_close_label), da ? "NED" : "DOWN");

          lv_obj_t *cards[4] = {
            id(cover_slot1_card), id(cover_slot2_card), id(cover_slot3_card), id(cover_slot4_card)
          };
          lv_obj_t *cover_icons[4] = {
            id(cover_slot1_icon), id(cover_slot2_icon), id(cover_slot3_icon), id(cover_slot4_icon)
          };
          lv_obj_t *p0[4] = {
            id(cover_slot1_p0_button), id(cover_slot2_p0_button), id(cover_slot3_p0_button), id(cover_slot4_p0_button)
          };
          lv_obj_t *p25[4] = {
            id(cover_slot1_p25_button), id(cover_slot2_p25_button), id(cover_slot3_p25_button), id(cover_slot4_p25_button)
          };
          lv_obj_t *p50[4] = {
            id(cover_slot1_p50_button), id(cover_slot2_p50_button), id(cover_slot3_p50_button), id(cover_slot4_p50_button)
          };
          lv_obj_t *p75[4] = {
            id(cover_slot1_p75_button), id(cover_slot2_p75_button), id(cover_slot3_p75_button), id(cover_slot4_p75_button)
          };
          lv_obj_t *p100[4] = {
            id(cover_slot1_p100_button), id(cover_slot2_p100_button), id(cover_slot3_p100_button), id(cover_slot4_p100_button)
          };
          lv_obj_t *p0_labels[4] = {
            id(cover_slot1_p0_label), id(cover_slot2_p0_label), id(cover_slot3_p0_label), id(cover_slot4_p0_label)
          };
          lv_obj_t *p50_labels[4] = {
            id(cover_slot1_p50_label), id(cover_slot2_p50_label), id(cover_slot3_p50_label), id(cover_slot4_p50_label)
          };
          lv_obj_t *p100_labels[4] = {
            id(cover_slot1_p100_label), id(cover_slot2_p100_label), id(cover_slot3_p100_label), id(cover_slot4_p100_label)
          };
          lv_obj_t *name_labels[4] = {
            id(cover_slot1_name_label), id(cover_slot2_name_label),
            id(cover_slot3_name_label), id(cover_slot4_name_label)
          };
          lv_obj_t *state_labels[4] = {
            id(cover_slot1_state_label), id(cover_slot2_state_label),
            id(cover_slot3_state_label), id(cover_slot4_state_label)
          };
          const esphome::wall_panel::CoverSlotState *slots[4] = {
            &panel.get_cover_slot(1), &panel.get_cover_slot(2),
            &panel.get_cover_slot(3), &panel.get_cover_slot(4)
          };
          static int last_cover_icon_state[4] = {-1, -1, -1, -1};

          int visible_indices[4];
          int visible_count = 0;
          for (int i = 0; i < 4; i++) {
            set_hidden_if_changed(cards[i], !slots[i]->configured);
            if (slots[i]->configured)
              visible_indices[visible_count++] = i;
          }

          for (int rank = 0; rank < visible_count; rank++) {
            const int i = visible_indices[rank];
            const bool full_width = visible_count <= 2;
            const bool positioned = slots[i]->has_position;
            const bool fully_open = slots[i]->available &&
              ((slots[i]->has_position && slots[i]->position_pct >= 100) ||
               (!slots[i]->has_position && slots[i]->state == "open"));
            const int icon_state = fully_open ? 1 : 0;

            if (last_cover_icon_state[i] != icon_state) {
              last_cover_icon_state[i] = icon_state;
              esphome::lvgl::lv_image_set_src(
                cover_icons[i], fully_open ? id(icon_blinds_open) : id(icon_blinds)
              );
            }

            if (full_width)
              set_geometry_if_changed(cards[i], 20, 72 + rank * 150, 440);
            else
              set_geometry_if_changed(cards[i], rank % 2 == 0 ? 20 : 250, rank < 2 ? 72 : 222, 210);

            if (positioned) {
              set_text_if_changed(p0_labels[i], "0%");
              set_text_if_changed(p50_labels[i], "50%");
              set_text_if_changed(p100_labels[i], "100%");

              set_hidden_if_changed(p25[i], !full_width);
              set_hidden_if_changed(p75[i], !full_width);

              if (full_width) {
                set_geometry_if_changed(p0[i], 14, 82, 76);
                set_geometry_if_changed(p25[i], 98, 82, 76);
                set_geometry_if_changed(p50[i], 182, 82, 76);
                set_geometry_if_changed(p75[i], 266, 82, 76);
                set_geometry_if_changed(p100[i], 350, 82, 76);
              } else {
                set_geometry_if_changed(p0[i], 10, 82, 58);
                set_geometry_if_changed(p50[i], 76, 82, 58);
                set_geometry_if_changed(p100[i], 142, 82, 58);
              }
            } else {
              set_hidden_if_changed(p25[i], true);
              set_hidden_if_changed(p75[i], true);
              set_text_if_changed(p0_labels[i], da ? "OP" : "UP");
              set_text_if_changed(p50_labels[i], "STOP");
              set_text_if_changed(p100_labels[i], da ? "NED" : "DOWN");

              if (full_width) {
                set_geometry_if_changed(p0[i], 14, 82, 132);
                set_geometry_if_changed(p50[i], 154, 82, 132);
                set_geometry_if_changed(p100[i], 294, 82, 132);
              } else {
                set_geometry_if_changed(p0[i], 10, 82, 58);
                set_geometry_if_changed(p50[i], 76, 82, 58);
                set_geometry_if_changed(p100[i], 142, 82, 58);
              }
            }

            set_text_if_changed(name_labels[i], slots[i]->name.c_str());

            char state_text[48];
            if (!slots[i]->available) {
              snprintf(state_text, sizeof(state_text), "%s", da ? "Ikke tilgængelig" : "Unavailable");
            } else if (slots[i]->state == "opening") {
              if (slots[i]->has_position)
                snprintf(state_text, sizeof(state_text), "%s · %d%%", da ? "Åbner" : "Opening", slots[i]->position_pct);
              else
                snprintf(state_text, sizeof(state_text), "%s", da ? "Åbner" : "Opening");
            } else if (slots[i]->state == "closing") {
              if (slots[i]->has_position)
                snprintf(state_text, sizeof(state_text), "%s · %d%%", da ? "Lukker" : "Closing", slots[i]->position_pct);
              else
                snprintf(state_text, sizeof(state_text), "%s", da ? "Lukker" : "Closing");
            } else if (slots[i]->has_position) {
              snprintf(state_text, sizeof(state_text), "%d%%", slots[i]->position_pct);
            } else if (slots[i]->state == "open") {
              snprintf(state_text, sizeof(state_text), "%s", da ? "Åben" : "Open");
            } else if (slots[i]->state == "closed") {
              snprintf(state_text, sizeof(state_text), "%s", da ? "Lukket" : "Closed");
            } else {
              snprintf(state_text, sizeof(state_text), "%s", slots[i]->state.c_str());
            }
            set_text_if_changed(state_labels[i], state_text);
          }

          if (id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4 && !id(cover_position_dirty)) {
            const auto &slot = panel.get_cover_slot(id(active_cover_slot));
            set_text_if_changed(id(cover_detail_name), slot.name.c_str());

            if (slot.has_position) {
              if (lv_slider_get_value(id(cover_detail_slider)) != slot.position_pct) {
                id(cover_slider_syncing) = true;
                lv_slider_set_value(id(cover_detail_slider), slot.position_pct, LV_ANIM_OFF);
                id(cover_slider_syncing) = false;
              }

              char text[16];
              snprintf(text, sizeof(text), "%d%%", slot.position_pct);
              set_text_if_changed(id(cover_detail_percent), text);
            }
          }

  - interval: 750ms
    then:
      - if:
          condition:
            lambda: return id(cover_position_dirty) && id(active_cover_slot) >= 1 && id(active_cover_slot) <= 4;
          then:
            - lambda: |-
                id(wall_panel_controller).set_cover_position(id(active_cover_slot), id(pending_cover_position));
                id(cover_position_dirty) = false;
