interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &panel = *id(wall_panel_controller);
          const bool da = std::string(panel.get_language_option()) == "Danish";
          lv_label_set_text(id(blinds_page_title), panel.tr(esphome::wall_panel::TranslationKey::BLINDS));

          lv_label_set_text(id(cover_slot1_open_label), da ? "OP" : "UP");
          lv_label_set_text(id(cover_slot2_open_label), da ? "OP" : "UP");
          lv_label_set_text(id(cover_slot3_open_label), da ? "OP" : "UP");
          lv_label_set_text(id(cover_slot4_open_label), da ? "OP" : "UP");
          lv_label_set_text(id(cover_slot1_close_label), da ? "NED" : "DOWN");
          lv_label_set_text(id(cover_slot2_close_label), da ? "NED" : "DOWN");
          lv_label_set_text(id(cover_slot3_close_label), da ? "NED" : "DOWN");
          lv_label_set_text(id(cover_slot4_close_label), da ? "NED" : "DOWN");

          auto update_card = [da](lv_obj_t *card, lv_obj_t *name_label, lv_obj_t *state_label,
                                  const esphome::wall_panel::CoverSlotState &slot) {
            if (!slot.configured) {
              lv_obj_add_flag(card, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            lv_obj_clear_flag(card, LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(name_label, slot.name.c_str());

            if (!slot.available) {
              lv_label_set_text(state_label, da ? "Ikke tilgængelig" : "Unavailable");
              lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
              return;
            }

            char text[48];
            if (slot.state == "opening") {
              snprintf(text, sizeof(text), "%s", da ? "Åbner" : "Opening");
            } else if (slot.state == "closing") {
              snprintf(text, sizeof(text), "%s", da ? "Lukker" : "Closing");
            } else if (slot.has_position) {
              snprintf(text, sizeof(text), "%d%%", slot.position_pct);
            } else if (slot.state == "open") {
              snprintf(text, sizeof(text), "%s", da ? "Åben" : "Open");
            } else if (slot.state == "closed") {
              snprintf(text, sizeof(text), "%s", da ? "Lukket" : "Closed");
            } else {
              snprintf(text, sizeof(text), "%s", slot.state.c_str());
            }
            lv_label_set_text(state_label, text);
            lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
          };

          update_card(id(cover_slot1_card), id(cover_slot1_name_label), id(cover_slot1_state_label), panel.get_cover_slot(1));
          update_card(id(cover_slot2_card), id(cover_slot2_name_label), id(cover_slot2_state_label), panel.get_cover_slot(2));
          update_card(id(cover_slot3_card), id(cover_slot3_name_label), id(cover_slot3_state_label), panel.get_cover_slot(3));
          update_card(id(cover_slot4_card), id(cover_slot4_name_label), id(cover_slot4_state_label), panel.get_cover_slot(4));
