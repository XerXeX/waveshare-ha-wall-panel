switch:
  - platform: template
    id: light_slot1_ignore_all_off
    name: "Lys · Slot 1 · Ignorer Sluk alt"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(wall_panel_controller).set_ignore_all_off(1, true);
    on_turn_off:
      - lambda: |-
          id(wall_panel_controller).set_ignore_all_off(1, false);

