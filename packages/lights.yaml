            height: 52
            bg_color: 0x181B20
            radius: 16
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  id(active_light_slot) = 0;
                  id(light_brightness_dirty) = false;
              - lvgl.page.show: lights_page
            widgets:
              - label:
                  align: CENTER
                  text: "‹"
                  text_font: ui_font_34
                  text_color: 0xFFFFFF

        - label:
            id: light_detail_name
            x: 104
            y: 26
            text: "Light"
            text_font: ui_font_28
            text_color: 0xFFFFFF

        - image:
            id: light_detail_icon
            src: icon_lightbulb
            align: CENTER
            y: -95
            image_recolor: 0xFFB300
            image_recolor_opa: 100%

        - label:
            id: light_detail_percent
            align: CENTER
            y: -35
            text: "--%"
            text_font: ui_font_34
            text_color: 0xFFFFFF

        - slider:
            id: light_detail_slider
            x: 40
            y: 270
            width: 400
            height: 42
            min_value: 0
            max_value: 100
            value: 50
            bg_color: 0x343A44
            indicator:
              bg_color: 0xFFB300
            knob:
              bg_color: 0xFFFFFF
            on_value:
              - lambda: |-
                  char text[16];
                  snprintf(text, sizeof(text), "%d%%", (int) x);
                  lv_label_set_text(id(light_detail_percent), text);
            on_change:
              - lambda: |-
                  if (id(light_slider_syncing))
                    return;
                  id(pending_light_brightness) = (int) x;
                  id(light_brightness_dirty) = true;

interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &panel = *id(wall_panel_controller);
          lv_label_set_text(id(lights_page_title), panel.tr(esphome::wall_panel::TranslationKey::LIGHTS));

          auto update_card = [&panel](lv_obj_t *card, lv_obj_t *icon, lv_obj_t *name_label, lv_obj_t *state_label,
                                     const esphome::wall_panel::LightSlotState &slot) {
            const bool all_off = slot.function == "All off";
            const bool hidden = slot.function == "Hidden" || (slot.function == "Auto" && !slot.configured);

            if (hidden) {
              lv_obj_add_flag(card, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            lv_obj_clear_flag(card, LV_OBJ_FLAG_HIDDEN);

            lv_label_set_text(name_label, slot.name.empty()
              ? (all_off ? panel.tr(esphome::wall_panel::TranslationKey::ALL_OFF)
                         : panel.tr(esphome::wall_panel::TranslationKey::LIGHT))
              : slot.name.c_str());
            lv_obj_set_style_image_recolor_opa(icon, LV_OPA_COVER, LV_PART_MAIN);

            if (all_off) {
              lv_obj_set_style_bg_color(card, lv_color_hex(0x181B20), LV_PART_MAIN);
              lv_obj_set_style_image_recolor(icon, lv_color_hex(0x858B94), LV_PART_MAIN);
              lv_label_set_text(state_label, panel.tr(esphome::wall_panel::TranslationKey::ALL_LIGHTS));
              lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
              return;
            }

            if (!slot.available) {
              lv_obj_set_style_bg_color(card, lv_color_hex(0x181B20), LV_PART_MAIN);
              lv_obj_set_style_image_recolor(icon, lv_color_hex(0x555A62), LV_PART_MAIN);
              lv_label_set_text(state_label, panel.tr(esphome::wall_panel::TranslationKey::UNAVAILABLE));
              lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
              return;
            }

            if (slot.is_on) {
              lv_obj_set_style_bg_color(card, lv_color_hex(0x343A44), LV_PART_MAIN);
              lv_obj_set_style_image_recolor(icon, lv_color_hex(0xFFB300), LV_PART_MAIN);
              if (slot.has_brightness) {
                char text[16];
                snprintf(text, sizeof(text), "%d%%", slot.brightness_pct);
                lv_label_set_text(state_label, text);
              } else {
                lv_label_set_text(state_label, panel.tr(esphome::wall_panel::TranslationKey::ON));
              }
              lv_obj_set_style_text_color(state_label, lv_color_hex(0xFFB300), LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(card, lv_color_hex(0x181B20), LV_PART_MAIN);
              lv_obj_set_style_image_recolor(icon, lv_color_hex(0x858B94), LV_PART_MAIN);
              lv_label_set_text(state_label, panel.tr(esphome::wall_panel::TranslationKey::OFF));
              lv_obj_set_style_text_color(state_label, lv_color_hex(0x858B94), LV_PART_MAIN);
            }
          };

          update_card(id(light_slot1_card), id(light_slot1_icon), id(light_slot1_name_label), id(light_slot1_state_label),
                      panel.get_light_slot(1));
          update_card(id(light_slot2_card), id(light_slot2_icon), id(light_slot2_name_label), id(light_slot2_state_label),
                      panel.get_light_slot(2));
          update_card(id(light_slot3_card), id(light_slot3_icon), id(light_slot3_name_label), id(light_slot3_state_label),
                      panel.get_light_slot(3));
          update_card(id(light_slot4_card), id(light_slot4_icon), id(light_slot4_name_label), id(light_slot4_state_label),
                      panel.get_light_slot(4));

          if (id(active_light_slot) >= 1 && id(active_light_slot) <= 4 && !id(light_brightness_dirty)) {
            const auto &slot = panel.get_light_slot(id(active_light_slot));
            lv_label_set_text(id(light_detail_name), slot.name.empty()
              ? panel.tr(esphome::wall_panel::TranslationKey::LIGHT)
              : slot.name.c_str());

            if (slot.has_brightness) {
              id(light_slider_syncing) = true;
              lv_slider_set_value(id(light_detail_slider), slot.brightness_pct, LV_ANIM_OFF);
              id(light_slider_syncing) = false;
              char text[16];
              snprintf(text, sizeof(text), "%d%%", slot.brightness_pct);
              lv_label_set_text(id(light_detail_percent), text);
              lv_obj_set_style_image_recolor(id(light_detail_icon),
                                             lv_color_hex(slot.is_on ? 0xFFB300 : 0x858B94), LV_PART_MAIN);
              lv_obj_set_style_image_recolor_opa(id(light_detail_icon), LV_OPA_COVER, LV_PART_MAIN);
            }
          }

  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(light_brightness_dirty) && id(active_light_slot) >= 1 && id(active_light_slot) <= 4;
          then:
            - lambda: |-
                id(wall_panel_controller).set_light_brightness(id(active_light_slot), id(pending_light_brightness));
                id(light_brightness_dirty) = false;
