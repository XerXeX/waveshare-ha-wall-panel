# Light page configuration
#
# Each slot exposes four configuration entities in Home Assistant:
#   - Name
#   - Entity
#   - Function
#   - Ignore All Off
#
# Entity changes are passed directly to the wall_panel component. The component
# subscribes to the new Home Assistant entity at runtime, so no reboot is needed.

globals:
  - id: active_light_slot
    type: int
    restore_value: false
    initial_value: '0'

  - id: pending_light_brightness
    type: int
    restore_value: false
    initial_value: '0'

  - id: light_brightness_dirty
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: light_slider_syncing
    type: bool
    restore_value: false
    initial_value: 'false'

text:
  # ---------------------------------------------------------
  # Slot 1
  # ---------------------------------------------------------
  - platform: template
    id: light_slot1_name
    name: "Lys · Slot 1 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 1"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(1, x);

  - platform: template
    id: light_slot1_entity
    name: "Lys · Slot 1 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(1, x);

  # ---------------------------------------------------------
  # Slot 2
  # ---------------------------------------------------------
  - platform: template
    id: light_slot2_name
    name: "Lys · Slot 2 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 2"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(2, x);

  - platform: template
    id: light_slot2_entity
    name: "Lys · Slot 2 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(2, x);

  # ---------------------------------------------------------
  # Slot 3
  # ---------------------------------------------------------
  - platform: template
    id: light_slot3_name
    name: "Lys · Slot 3 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 3"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(3, x);

  - platform: template
    id: light_slot3_entity
    name: "Lys · Slot 3 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(3, x);

  # ---------------------------------------------------------
  # Slot 4
  # ---------------------------------------------------------
  - platform: template
    id: light_slot4_name
    name: "Lys · Slot 4 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Sluk alt"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(4, x);

  - platform: template
    id: light_slot4_entity
    name: "Lys · Slot 4 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(4, x);

select:
  - platform: template
    id: light_slot1_function
    name: "Lys · Slot 1 · Funktion"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "Sluk alt", "Skjult"]
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_function(1, x);

  - platform: template
    id: light_slot2_function
    name: "Lys · Slot 2 · Funktion"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "Sluk alt", "Skjult"]
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_function(2, x);

  - platform: template
    id: light_slot3_function
    name: "Lys · Slot 3 · Funktion"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "Sluk alt", "Skjult"]
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_function(3, x);

  - platform: template
    id: light_slot4_function
    name: "Lys · Slot 4 · Funktion"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Sluk alt"
    options: ["Auto", "Sluk alt", "Skjult"]
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_function(4, x);

switch:
  - platform: template
    id: light_slot1_ignore_all_off
    name: "Lys · Slot 1 · Ignorer Sluk alt"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wall_panel_controller).set_ignore_all_off(1, true);
    on_turn_off:
      - lambda: id(wall_panel_controller).set_ignore_all_off(1, false);

  - platform: template
    id: light_slot2_ignore_all_off
    name: "Lys · Slot 2 · Ignorer Sluk alt"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wall_panel_controller).set_ignore_all_off(2, true);
    on_turn_off:
      - lambda: id(wall_panel_controller).set_ignore_all_off(2, false);

  - platform: template
    id: light_slot3_ignore_all_off
    name: "Lys · Slot 3 · Ignorer Sluk alt"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wall_panel_controller).set_ignore_all_off(3, true);
    on_turn_off:
      - lambda: id(wall_panel_controller).set_ignore_all_off(3, false);

  - platform: template
    id: light_slot4_ignore_all_off
    name: "Lys · Slot 4 · Ignorer Sluk alt"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wall_panel_controller).set_ignore_all_off(4, true);
    on_turn_off:
      - lambda: id(wall_panel_controller).set_ignore_all_off(4, false);

# -----------------------------------------------------------
# Light pages
# -----------------------------------------------------------

lvgl:
  id: wall_panel_lvgl
  displays: lcd
  touchscreens:
    - touchscreen_id: touch
  bg_color: 0x101216
  pages:
    - id: lights_page
      bg_color: 0x101216
      widgets:
        - label:
            id: lights_page_title
            x: 20
            y: 18
            text: "Lys"
            text_font: ui_font_34
            text_color: 0xFFFFFF

        - button:
            id: light_slot1_card
            x: 20
            y: 72
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_short_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_light_slot(1);
            on_long_press:
              - if:
                  condition:
                    lambda: |-
                      const auto &slot = id(wall_panel_controller).get_light_slot(1);
                      return slot.function == "Auto" && slot.configured && slot.available && slot.has_brightness;
                  then:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_light_slot(1);
                        id(active_light_slot) = 1;
                        id(light_brightness_dirty) = false;
                        lv_label_set_text(id(light_detail_name), slot.name.empty() ? "Lys" : slot.name.c_str());
                        char text[16];
                        snprintf(text, sizeof(text), "%d%%", slot.brightness_pct);
                        lv_label_set_text(id(light_detail_percent), text);
                        id(light_slider_syncing) = true;
                        lv_slider_set_value(id(light_detail_slider), slot.brightness_pct, LV_ANIM_OFF);
                        id(light_slider_syncing) = false;
                    - lvgl.page.show: light_detail_page
            widgets:
              - image:
                  id: light_slot1_icon
                  src: icon_lightbulb
                  x: 16
                  y: 16
