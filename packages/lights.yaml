select:
  - platform: template
    id: light_slot1_function
    name: "Lys · Slot 1 · Funktion"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options:
      - "Auto"
      - "Sluk alt"
      - "Skjult"
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_function(1, x);

