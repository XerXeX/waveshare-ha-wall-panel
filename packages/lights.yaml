# Light page configuration
#
# Each slot exposes four configuration entities in Home Assistant:
#   - Name
#   - Entity
#   - Function
#   - Ignore All Off
#
# Entity changes are passed directly to the wall_panel component. The component
# subscribes to the new Home Assistant entity at runtime, so no reboot is needed.

text:
  # ---------------------------------------------------------
  # Slot 1
  # ---------------------------------------------------------
  - platform: template
    id: light_slot1_name
    name: "Lys · Slot 1 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 1"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(1, x);

  - platform: template
    id: light_slot1_entity
    name: "Lys · Slot 1 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(1, x);

  # ---------------------------------------------------------
  # Slot 2
  # ---------------------------------------------------------
  - platform: template
    id: light_slot2_name
    name: "Lys · Slot 2 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 2"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(2, x);

  - platform: template
    id: light_slot2_entity
    name: "Lys · Slot 2 · Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_entity(2, x);

  # ---------------------------------------------------------
  # Slot 3
  # ---------------------------------------------------------
  - platform: template
    id: light_slot3_name
    name: "Lys · Slot 3 · Navn"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Light 3"
    min_length: 0
    max_length: 32
    mode: text
    on_value:
      then:
        - lambda: |-
            id(wall_panel_controller).set_light_name(3, x);

  - platform: template
