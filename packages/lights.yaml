# Light page configuration
#
# Each slot exposes four configuration entities in Home Assistant:
#   - Name
#   - Entity
#   - Function
#   - Ignore All Off
#
# Function can be Auto, WLED, All off or Hidden. WLED deliberately maps to the
# component's normal Auto light behaviour for short presses; long press is routed
# to the shared WLED detail page from packages/home_wled.yaml.

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            const auto &slot1 = id(wall_panel_controller).get_light_slot(1);
            const auto &slot2 = id(wall_panel_controller).get_light_slot(2);
            const auto &slot3 = id(wall_panel_controller).get_light_slot(3);
            const auto &slot4 = id(wall_panel_controller).get_light_slot(4);

            id(light_slot1_name).publish_state(slot1.name);
            id(light_slot1_entity).publish_state(slot1.entity_id);
            id(light_slot1_ignore_all_off).publish_state(slot1.ignore_all_off);

            id(light_slot2_name).publish_state(slot2.name);
            id(light_slot2_entity).publish_state(slot2.entity_id);
            id(light_slot2_ignore_all_off).publish_state(slot2.ignore_all_off);

            id(light_slot3_name).publish_state(slot3.name);
            id(light_slot3_entity).publish_state(slot3.entity_id);
            id(light_slot3_ignore_all_off).publish_state(slot3.ignore_all_off);

            id(light_slot4_name).publish_state(slot4.name);
            id(light_slot4_entity).publish_state(slot4.entity_id);
            id(light_slot4_ignore_all_off).publish_state(slot4.ignore_all_off);

globals:
  - id: active_light_slot
    type: int
    restore_value: false
    initial_value: '0'

  - id: pending_light_brightness
    type: int
    restore_value: false
    initial_value: '0'

  - id: light_brightness_dirty
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: light_slider_syncing
    type: bool
    restore_value: false
    initial_value: 'false'

text:
  - platform: template
    id: light_slot1_name
    name: "Lights · Slot 1 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: "Light 1"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_name(1, x);
  - platform: template
    id: light_slot1_entity
    name: "Lights · Slot 1 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_entity(1, x);
  - platform: template
    id: light_slot2_name
    name: "Lights · Slot 2 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: "Light 2"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_name(2, x);
  - platform: template
    id: light_slot2_entity
    name: "Lights · Slot 2 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_entity(2, x);
  - platform: template
    id: light_slot3_name
    name: "Lights · Slot 3 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: "Light 3"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_name(3, x);
  - platform: template
    id: light_slot3_entity
    name: "Lights · Slot 3 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_entity(3, x);
  - platform: template
    id: light_slot4_name
    name: "Lights · Slot 4 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: "All off"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_name(4, x);
  - platform: template
    id: light_slot4_entity
    name: "Lights · Slot 4 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - lambda: id(wall_panel_controller).set_light_entity(4, x);

select:
  - platform: template
    id: light_slot1_function
    name: "Lights · Slot 1 · 3 Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED", "All off", "Hidden"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_light_function(1, x == "WLED" ? std::string("Auto") : x.str());
  - platform: template
    id: light_slot2_function
    name: "Lights · Slot 2 · 3 Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED", "All off", "Hidden"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_light_function(2, x == "WLED" ? std::string("Auto") : x.str());
  - platform: template
    id: light_slot3_function
    name: "Lights · Slot 3 · 3 Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED", "All off", "Hidden"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_light_function(3, x == "WLED" ? std::string("Auto") : x.str());
  - platform: template
    id: light_slot4_function
    name: "Lights · Slot 4 · 3 Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "All off"
    options: ["Auto", "WLED", "All off", "Hidden"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_light_function(4, x == "WLED" ? std::string("Auto") : x.str());

switch:
  - platform: template
    id: light_slot1_ignore_all_off
    name: "Lights · Slot 1 · 4 Ignore All Off"
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(1, true);
    turn_off_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(1, false);
  - platform: template
    id: light_slot2_ignore_all_off
    name: "Lights · Slot 2 · 4 Ignore All Off"
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(2, true);
    turn_off_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(2, false);
  - platform: template
    id: light_slot3_ignore_all_off
    name: "Lights · Slot 3 · 4 Ignore All Off"
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(3, true);
    turn_off_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(3, false);
  - platform: template
    id: light_slot4_ignore_all_off
    name: "Lights · Slot 4 · 4 Ignore All Off"
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(4, true);
    turn_off_action:
      - lambda: id(wall_panel_controller).set_ignore_all_off(4, false);

lvgl:
  id: wall_panel_lvgl
  displays: lcd
  touchscreens:
    - touchscreen_id: touch
  bg_color: 0x101216
  pages:
    - id: lights_page
      bg_color: 0x101216
      widgets:
        - label:
            id: lights_page_title
            x: 20
            y: 18
            text: "Lights"
            text_font: ui_font_34
            text_color: 0xFFFFFF

        - button:
            id: light_slot1_card
            x: 20
            y: 72
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_short_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_light_slot(1);
            on_long_press:
              - script.execute:
                  id: light_slot_long_action
                  slot: 1
            widgets:
              - image: { id: light_slot1_icon, src: icon_lightbulb, x: 16, y: 16 }
              - label: { id: light_slot1_name_label, x: 16, y: 65, text: "Light 1", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: light_slot1_state_label, x: 16, y: 98, text: "--", text_font: ui_font_18, text_color: 0x858B94 }

        - button:
            id: light_slot2_card
            x: 250
            y: 72
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_short_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_light_slot(2);
            on_long_press:
              - script.execute:
                  id: light_slot_long_action
                  slot: 2
            widgets:
              - image: { id: light_slot2_icon, src: icon_lightbulb, x: 16, y: 16 }
              - label: { id: light_slot2_name_label, x: 16, y: 65, text: "Light 2", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: light_slot2_state_label, x: 16, y: 98, text: "--", text_font: ui_font_18, text_color: 0x858B94 }

        - button:
            id: light_slot3_card
            x: 20
            y: 222
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_short_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_light_slot(3);
            on_long_press:
              - script.execute:
                  id: light_slot_long_action
                  slot: 3
            widgets:
              - image: { id: light_slot3_icon, src: icon_lightbulb, x: 16, y: 16 }
              - label: { id: light_slot3_name_label, x: 16, y: 65, text: "Light 3", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: light_slot3_state_label, x: 16, y: 98, text: "--", text_font: ui_font_18, text_color: 0x858B94 }

        - button:
            id: light_slot4_card
            x: 250
            y: 222
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_short_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_light_slot(4);
            on_long_press:
              - script.execute:
                  id: light_slot_long_action
                  slot: 4
            widgets:
              - image: { id: light_slot4_icon, src: icon_lightbulb, x: 16, y: 16 }
              - label: { id: light_slot4_name_label, x: 16, y: 65, text: "All off", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: light_slot4_state_label, x: 16, y: 98, text: "All lights", text_font: ui_font_18, text_color: 0x858B94 }

    - id: light_detail_page
      bg_color: 0x101216
      widgets:
        - button:
            id: light_detail_back
            x: 20
            y: 18
            width: 64
            height: 52
            bg_color: 0x181B20
            radius: 16
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  id(active_light_slot) = 0;
                  id(light_brightness_dirty) = false;
              - lvgl.page.show: lights_page
            widgets:
              - label:
                  align: CENTER
                  text: "‹"
                  text_font: ui_font_34
                  text_color: 0xFFFFFF
        - label:
            id: light_detail_name
            x: 104
            y: 26
            text: "Light"
            text_font: ui_font_28
            text_color: 0xFFFFFF
        - image:
            id: light_detail_icon
            src: icon_lightbulb
            align: CENTER
            y: -95
            image_recolor: 0xFFB300
            image_recolor_opa: 100%
        - label:
            id: light_detail_percent
            align: CENTER
            y: -35
            text: "--%"
            text_font: ui_font_34
            text_color: 0xFFFFFF
        - slider:
            id: light_detail_slider
            x: 40
            y: 270
            width: 400
            height: 42
            min_value: 0
            max_value: 100
            value: 50
            bg_color: 0x343A44
            indicator:
              bg_color: 0xFFB300
            knob:
              bg_color: 0xFFFFFF
            on_value:
              - lambda: |-
                  char text[16];
                  snprintf(text, sizeof(text), "%d%%", (int) x);
                  const char *current = lv_label_get_text(id(light_detail_percent));
                  if (current == nullptr || std::strcmp(current, text) != 0)
                    lv_label_set_text(id(light_detail_percent), text);
            on_change:
              - lambda: |-
                  if (id(light_slider_syncing))
                    return;
                  id(pending_light_brightness) = (int) x;
                  id(light_brightness_dirty) = true;

interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &panel = *id(wall_panel_controller);

          auto set_text_if_changed = [](lv_obj_t *label, const char *text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || std::strcmp(current, text) != 0)
              lv_label_set_text(label, text);
          };
          auto set_hidden_if_changed = [](lv_obj_t *obj, bool hidden) {
            const bool current = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (current == hidden)
              return;
            if (hidden)
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto set_geometry_if_changed = [](lv_obj_t *obj, int x, int y, int width) {
            if (lv_obj_get_x(obj) != x || lv_obj_get_y(obj) != y)
              lv_obj_set_pos(obj, x, y);
            if (lv_obj_get_width(obj) != width)
              lv_obj_set_width(obj, width);
          };

          set_text_if_changed(id(lights_page_title), id(wall_panel_language).tr("lights"));

          auto slot_visible = [](const esphome::wall_panel::LightSlotState &slot) {
            return slot.function != "Hidden" && (slot.function == "All off" || slot.configured);
          };

          lv_obj_t *cards[4] = {
            id(light_slot1_card), id(light_slot2_card), id(light_slot3_card), id(light_slot4_card)
          };
          lv_obj_t *icons[4] = {
            id(light_slot1_icon), id(light_slot2_icon), id(light_slot3_icon), id(light_slot4_icon)
          };
          lv_obj_t *name_labels[4] = {
            id(light_slot1_name_label), id(light_slot2_name_label),
            id(light_slot3_name_label), id(light_slot4_name_label)
          };
          lv_obj_t *state_labels[4] = {
            id(light_slot1_state_label), id(light_slot2_state_label),
            id(light_slot3_state_label), id(light_slot4_state_label)
          };
          const esphome::wall_panel::LightSlotState *slots[4] = {
            &panel.get_light_slot(1), &panel.get_light_slot(2),
            &panel.get_light_slot(3), &panel.get_light_slot(4)
          };

          int visible_indices[4];
          int visible_count = 0;
          for (int i = 0; i < 4; i++) {
            const bool visible = slot_visible(*slots[i]);
            set_hidden_if_changed(cards[i], !visible);
            if (visible)
              visible_indices[visible_count++] = i;
          }

          for (int rank = 0; rank < visible_count; rank++) {
            const int i = visible_indices[rank];
            if (visible_count <= 2)
              set_geometry_if_changed(cards[i], 20, 72 + rank * 150, 440);
            else
              set_geometry_if_changed(cards[i], rank % 2 == 0 ? 20 : 250, rank < 2 ? 72 : 222, 210);
          }

          static int last_visual[4] = {-1, -1, -1, -1};
          for (int i = 0; i < 4; i++) {
            const auto &slot = *slots[i];
            if (!slot_visible(slot))
              continue;

            const bool all_off = slot.function == "All off";
            const char *name = slot.name.empty()
              ? (all_off ? id(wall_panel_language).tr("all_off") : id(wall_panel_language).tr("light"))
              : slot.name.c_str();
            set_text_if_changed(name_labels[i], name);

            int visual = 0;
            const char *state_text = "";
            char brightness_text[16];

            if (all_off) {
              visual = 0;
              state_text = id(wall_panel_language).tr("all_lights");
            } else if (!slot.available) {
              visual = 1;
              state_text = id(wall_panel_language).tr("unavailable");
            } else if (slot.is_on) {
              visual = 2;
              if (slot.has_brightness) {
                snprintf(brightness_text, sizeof(brightness_text), "%d%%", slot.brightness_pct);
                state_text = brightness_text;
              } else {
                state_text = id(wall_panel_language).tr("on");
              }
            } else {
              visual = 3;
              state_text = id(wall_panel_language).tr("off");
            }

            set_text_if_changed(state_labels[i], state_text);

            if (last_visual[i] != visual) {
              last_visual[i] = visual;
              lv_obj_set_style_image_recolor_opa(icons[i], LV_OPA_COVER, LV_PART_MAIN);
              if (visual == 2) {
                lv_obj_set_style_bg_color(cards[i], lv_color_hex(0x343A44), LV_PART_MAIN);
                lv_obj_set_style_image_recolor(icons[i], lv_color_hex(0xFFB300), LV_PART_MAIN);
                lv_obj_set_style_text_color(state_labels[i], lv_color_hex(0xFFB300), LV_PART_MAIN);
              } else {
                lv_obj_set_style_bg_color(cards[i], lv_color_hex(0x181B20), LV_PART_MAIN);
                lv_obj_set_style_image_recolor(
                  icons[i], lv_color_hex(visual == 1 ? 0x555A62 : 0x858B94), LV_PART_MAIN);
                lv_obj_set_style_text_color(state_labels[i], lv_color_hex(0x858B94), LV_PART_MAIN);
              }
            }
          }

          if (id(active_light_slot) >= 1 && id(active_light_slot) <= 4 && !id(light_brightness_dirty)) {
            const auto &slot = panel.get_light_slot(id(active_light_slot));
            const char *name = slot.name.empty() ? id(wall_panel_language).tr("light") : slot.name.c_str();
            set_text_if_changed(id(light_detail_name), name);

            if (slot.has_brightness) {
              if (lv_slider_get_value(id(light_detail_slider)) != slot.brightness_pct) {
                id(light_slider_syncing) = true;
                lv_slider_set_value(id(light_detail_slider), slot.brightness_pct, LV_ANIM_OFF);
                id(light_slider_syncing) = false;
              }

              char text[16];
              snprintf(text, sizeof(text), "%d%%", slot.brightness_pct);
              set_text_if_changed(id(light_detail_percent), text);

              static int last_detail_visual = -1;
              const int detail_visual = slot.is_on ? 1 : 0;
              if (last_detail_visual != detail_visual) {
                last_detail_visual = detail_visual;
                lv_obj_set_style_image_recolor(
                  id(light_detail_icon), lv_color_hex(slot.is_on ? 0xFFB300 : 0x858B94), LV_PART_MAIN);
                lv_obj_set_style_image_recolor_opa(id(light_detail_icon), LV_OPA_COVER, LV_PART_MAIN);
              }
            }
          }

  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(light_brightness_dirty) && id(active_light_slot) >= 1 && id(active_light_slot) <= 4;
          then:
            - lambda: |-
                id(wall_panel_controller).set_light_brightness(id(active_light_slot), id(pending_light_brightness));
                id(light_brightness_dirty) = false;
