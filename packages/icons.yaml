# Shared Material Design Icon image library
#
# Icon IDs follow the MDI name with `mdi:` replaced by `icon_` and hyphens
# replaced by underscores. Example: mdi:weather-night -> icon_weather_night.
#
# All shared icons are 42x42 RGB565 images with alpha transparency so the same
# asset can be reused by navigation, scenes and other pages.

image:
  - { platform: file, file: "mdi:account", id: icon_account, resize: 42x42, type: RGB565, transparency: alpha_channel }
