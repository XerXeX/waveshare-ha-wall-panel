# Shared UI resources

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(wall_panel_language).publish_state(id(wall_panel_controller).get_language_option());
            id(wall_panel_rotation).publish_state(id(wall_panel_controller).get_display_rotation_option());

select:
  - platform: template
    id: wall_panel_language
    name: "Language"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: "English"
    options: ["English", "Danish"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_language(x);

  - platform: template
    id: wall_panel_rotation
    name: "Display Rotation"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: "0°"
    options: ["0°", "90°", "180°", "270°"]
    set_action:
      - lambda: |-
          const int rotation = x == "90°" ? 90 : x == "180°" ? 180 : x == "270°" ? 270 : 0;
          id(wall_panel_controller).set_display_rotation(rotation);
      - lvgl.display.set_rotation:
          lvgl_id: wall_panel_lvgl
          rotation: !lambda |-
            return x == "90°" ? 90 : x == "180°" ? 180 : x == "270°" ? 270 : 0;

font:
  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_18
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_22
    size: 22
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_28
    size: 28
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_34
    size: 34
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

image:
  - platform: file
    file: mdi:lightbulb
    id: icon_lightbulb
    resize: 34x34
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: mdi:wall-sconce-flat
    id: icon_lamp
    resize: 34x34
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: mdi:lightbulb-outline
    id: nav_light
    resize: 42x42
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: mdi:window-shutter
    id: nav_blinds
    resize: 42x42
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: mdi:speaker
    id: nav_audio
    resize: 42x42
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: mdi:palette-outline
    id: nav_scenes
    resize: 42x42
    type: RGB565
    transparency: alpha_channel

# Home Assistant does not send an action response when ESPHome service calls are
# blocked by the device option. The wall_panel component detects that timeout and
# raises this overlay so the user knows exactly which permission needs enabling.
lvgl:
  id: wall_panel_lvgl
  rotation: 0
  on_boot:
    - lvgl.widget.hide: ha_action_permission_overlay
    - lvgl.display.set_rotation:
        rotation: !lambda return id(wall_panel_controller).get_display_rotation();
    - lvgl.page.show: lights_page
  top_layer:
    widgets:
      - obj:
          id: bottom_nav
          x: 0
          y: 390
          width: 480
          height: 90
          bg_color: 0x101216
          bg_opa: 100%
          border_width: 0
          radius: 0
          clickable: false
          scrollable: false
          scrollbar_mode: "OFF"
          widgets:
            - button:
                id: nav_light_button
                x: 16
                y: 8
                width: 96
                height: 72
                bg_color: 0x343A44
                radius: 18
                border_width: 0
                clickable: false
                on_click:
                  - script.execute: ui_click
                  - lvgl.page.show: lights_page
                  - lambda: |-
                      lv_obj_clear_flag(id(nav_light_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_blinds_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_audio_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_scenes_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_style_bg_color(id(nav_light_button), lv_color_hex(0x343A44), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_blinds_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_audio_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_scenes_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_light_icon), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_blinds_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_audio_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_scenes_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                widgets:
                  - image:
                      id: nav_light_icon
                      src: nav_light
                      align: CENTER
                      image_recolor: 0xFFFFFF
                      image_recolor_opa: 100%

            - button:
                id: nav_blinds_button
                x: 128
                y: 8
                width: 96
                height: 72
                bg_color: 0x181B20
                radius: 18
                border_width: 0
                on_click:
                  - script.execute: ui_click
                  - lvgl.page.show: blinds_page
                  - lambda: |-
                      lv_obj_add_flag(id(nav_light_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_clear_flag(id(nav_blinds_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_audio_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_scenes_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_style_bg_color(id(nav_light_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_blinds_button), lv_color_hex(0x343A44), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_audio_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_scenes_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_light_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_blinds_icon), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_audio_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_scenes_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                widgets:
                  - image:
                      id: nav_blinds_icon
