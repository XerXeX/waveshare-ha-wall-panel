                      lv_obj_set_style_image_recolor(id(nav_light_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_blinds_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
                      lv_obj_set_style_image_recolor(id(nav_audio_icon), lv_color_hex(0x858B94), LV_PART_MAIN);
