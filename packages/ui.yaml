            - button:
                id: nav_scenes_button
                x: 352
                y: 8
                width: 96
                height: 72
                bg_color: 0x181B20
                radius: 18
                border_width: 0
                on_click:
                  - script.execute: ui_click
                  - lvgl.page.show: scenes_page
                  - lambda: |-
                      lv_obj_add_flag(id(nav_light_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_blinds_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(id(nav_audio_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_clear_flag(id(nav_scenes_button), LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_style_bg_color(id(nav_light_button), lv_color_hex(0x181B20), LV_PART_MAIN);
                      lv_obj_set_style_bg_color(id(nav_blinds_button), lv_color_hex(0x181B20), LV_PART_MAIN);
