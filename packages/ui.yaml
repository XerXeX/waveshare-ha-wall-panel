    size: 34
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

# Home Assistant does not send an action response when ESPHome service calls are
# blocked by the device option. The wall_panel component detects that timeout and
# raises this overlay so the user knows exactly which permission needs enabling.
lvgl:
  id: wall_panel_lvgl
  rotation: 0
  on_boot:
    - lvgl.widget.hide: ha_action_permission_overlay
    - lvgl.display.set_rotation:
        rotation: !lambda return id(wall_panel_controller).get_display_rotation();
    - script.execute:
        id: wall_panel_show_main_page
        page: 1
        remember: true
  top_layer:
    widgets:
      - obj:
          id: bottom_nav
          x: 0
          y: 390
          width: 480
          height: 90
          bg_color: 0x101216
          bg_opa: 100%
          border_width: 0
          radius: 0
          clickable: false
          scrollable: false
          scrollbar_mode: "OFF"
          widgets:
            - button:
                id: nav_home_button
                x: 16
                y: 8
                width: 96
                height: 72
                bg_color: 0x343A44
                radius: 18
                border_width: 0
                clickable: false
                on_click:
                  - script.execute: ui_click
                  - script.execute:
                      id: wall_panel_show_main_page
                      page: 1
                      remember: true
                widgets:
                  - image:
                      id: nav_home_icon
                      src: icon_home
                      align: CENTER
                      image_recolor: 0xFFFFFF
                      image_recolor_opa: 100%

            - button:
                id: nav_light_button
                x: 128
                y: 8
                width: 96
                height: 72
                bg_color: 0x181B20
                radius: 18
                border_width: 0
                on_click:
                  - script.execute: ui_click
                  - script.execute:
                      id: wall_panel_show_main_page
                      page: 2
                      remember: true
                widgets:
                  - image:
                      id: nav_light_icon
                      src: icon_lightbulb_outline
                      align: CENTER
                      image_recolor: 0x858B94
                      image_recolor_opa: 100%

            - button:
                id: nav_blinds_button
                x: 240
                y: 8
                width: 96
                height: 72
                bg_color: 0x181B20
                radius: 18
                border_width: 0
                on_click:
                  - script.execute: ui_click
                  - script.execute:
                      id: wall_panel_show_main_page
                      page: 3
                      remember: true
                widgets:
                  - image:
                      id: nav_blinds_icon
                      src: icon_blinds
                      align: CENTER
                      image_recolor: 0x858B94
                      image_recolor_opa: 100%

            - button:
                id: nav_scenes_button
                x: 352
                y: 8
                width: 96
                height: 72
                bg_color: 0x181B20
                radius: 18
                border_width: 0
                on_click:
                  - script.execute: ui_click
                  - script.execute:
                      id: wall_panel_show_main_page
                      page: 4
                      remember: true
                widgets:
                  - image:
                      id: nav_scenes_icon
                      src: icon_palette_outline
                      align: CENTER
                      image_recolor: 0x858B94
                      image_recolor_opa: 100%

      - obj:
          id: ha_action_permission_overlay
          x: 20
          y: 80
          width: 440
          height: 300
          bg_color: 0x181B20
          bg_opa: 100%
          radius: 20
          border_width: 1
          border_color: 0x343A44
          clickable: true
          widgets:
            - label:
                x: 24
                y: 22
                text: "Home Assistant"
                text_font: ui_font_28
                text_color: 0xFFFFFF

            - label:
                id: ha_action_permission_body
                x: 24
                y: 78
                width: 392
                text: !lambda |-
                  return std::string(id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::ACTION_PERMISSION_MESSAGE));
                text_font: ui_font_18
                text_color: 0xFFFFFF
                long_mode: wrap

            - button:
                x: 300
                y: 228
                width: 116
                height: 52
                bg_color: 0x343A44
                radius: 14
                border_width: 0
                on_click:
                  - lambda: id(wall_panel_controller).dismiss_action_permission_warning();
                  - lvgl.widget.hide: ha_action_permission_overlay
                widgets:
                  - label:
                      align: CENTER
                      text: "OK"
                      text_font: ui_font_22
                      text_color: 0xFFFFFF

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto set_label_if_changed = [](lv_obj_t *label, const char *text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || std::strcmp(current, text) != 0)
              lv_label_set_text(label, text);
          };

          set_label_if_changed(
            id(ha_action_permission_body),
            id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::ACTION_PERMISSION_MESSAGE)
          );
          set_label_if_changed(id(blinds_page_title), id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::BLINDS));
          set_label_if_changed(id(scenes_page_title), id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::SCENES));
      - if:
          condition:
            lambda: return id(wall_panel_controller).has_action_permission_warning();
          then:
            - if:
                condition:
                  lambda: return lv_obj_has_flag(id(ha_action_permission_overlay), LV_OBJ_FLAG_HIDDEN);
                then:
                  - lvgl.widget.show: ha_action_permission_overlay
