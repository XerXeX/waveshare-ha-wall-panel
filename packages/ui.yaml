# Shared UI resources

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(wall_panel_language).publish_state(id(wall_panel_controller).get_language_option());
            id(wall_panel_rotation).publish_state(id(wall_panel_controller).get_display_rotation_option());

globals:
  - id: wall_panel_last_user_page
    type: int
    restore_value: false
    initial_value: '1'

select:
  - platform: template
    id: wall_panel_language
    name: "Language"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: "English"
    options: ["English", "Danish"]
    set_action:
      - lambda: |-
          id(wall_panel_controller).set_language(x);

  - platform: template
    id: wall_panel_rotation
    name: "Display Rotation"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: "0°"
    options: ["0°", "90°", "180°", "270°"]
    set_action:
      - lambda: |-
          const int rotation = x == "90°" ? 90 : x == "180°" ? 180 : x == "270°" ? 270 : 0;
          id(wall_panel_controller).set_display_rotation(rotation);
      - lvgl.display.set_rotation:
          lvgl_id: wall_panel_lvgl
          rotation: !lambda |-
            return x == "90°" ? 90 : x == "180°" ? 180 : x == "270°" ? 270 : 0;

  - platform: template
    id: wall_panel_default_page
    name: "Default Page"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Home"
    options: ["None", "Home", "Lights", "Blinds", "Scenes"]

script:
  - id: wall_panel_show_main_page
    mode: restart
    parameters:
      page: int
      remember: bool
    then:
      - script.wait: ui_click
      - if:
          condition:
            lambda: return page == 1;
          then:
            - lvgl.page.show: home_page
      - if:
          condition:
            lambda: return page == 2;
          then:
            - lvgl.page.show: lights_page
      - if:
          condition:
            lambda: return page == 3;
          then:
            - lvgl.page.show: blinds_page
      - if:
          condition:
            lambda: return page == 4;
          then:
            - lvgl.page.show: scenes_page
      - lambda: |-
          // Clear any input ownership left behind by the previous page.
          lv_indev_reset(nullptr, nullptr);

          if (page == 2) {
            lv_obj_t *light_cards[4] = {
              id(light_slot1_card), id(light_slot2_card), id(light_slot3_card), id(light_slot4_card)
            };
            for (int i = 0; i < 4; i++) {
              lv_obj_clear_state(light_cards[i], LV_STATE_PRESSED);
              lv_obj_clear_state(light_cards[i], LV_STATE_FOCUSED);
            }
          }

          if (remember && page >= 1 && page <= 4)
            id(wall_panel_last_user_page) = page;

          lv_obj_t *buttons[4] = {
            id(nav_home_button), id(nav_light_button), id(nav_blinds_button), id(nav_scenes_button)
          };
          lv_obj_t *icons[4] = {
            id(nav_home_icon), id(nav_light_icon), id(nav_blinds_icon), id(nav_scenes_icon)
          };

          for (int i = 0; i < 4; i++) {
            lv_obj_clear_state(buttons[i], LV_STATE_PRESSED);
            lv_obj_clear_state(buttons[i], LV_STATE_FOCUSED);
            const bool active = page == i + 1;
            if (active)
              lv_obj_clear_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
            else
              lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(active ? 0x343A44 : 0x181B20), LV_PART_MAIN);
            lv_obj_set_style_image_recolor(icons[i], lv_color_hex(active ? 0xFFFFFF : 0x858B94), LV_PART_MAIN);
          }

  - id: wall_panel_show_default_page
    mode: restart
    then:
      - script.execute:
          id: wall_panel_show_main_page
          page: !lambda |-
            const auto option = id(wall_panel_default_page).current_option();
            if (option == "Home") return 1;
            if (option == "Lights") return 2;
            if (option == "Blinds") return 3;
            if (option == "Scenes") return 4;
            return id(wall_panel_last_user_page);
          remember: false

font:
  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_18
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_22
    size: 22
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
    id: ui_font_28
    size: 28
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "·"
      - "°"
      - "æøåÆØÅéÉ"

  - file: "https://raw.githubusercontent.com/XerXeX/waveshare-ha-wall-panel/main/assets/fonts/Roboto-Regular.ttf"
