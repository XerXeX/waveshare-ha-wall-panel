      - obj:
          id: ha_action_permission_overlay
          x: 20
          y: 80
          width: 440
          height: 300
          bg_color: 0x181B20
          bg_opa: 100%
          radius: 20
          border_width: 1
          border_color: 0x343A44
          clickable: true
          widgets:
            - label:
                x: 24
                y: 22
                text: "Home Assistant"
                text_font: ui_font_28
                text_color: 0xFFFFFF

            - label:
                id: ha_action_permission_body
                x: 24
                y: 78
                width: 392
                text: !lambda |-
                  return std::string(id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::ACTION_PERMISSION_MESSAGE));
                text_font: ui_font_18
                text_color: 0xFFFFFF
                long_mode: wrap

            - button:
                x: 300
                y: 228
                width: 116
                height: 52
                bg_color: 0x343A44
                radius: 14
                border_width: 0
                on_click:
                  - lambda: id(wall_panel_controller).dismiss_action_permission_warning();
                  - lvgl.widget.hide: ha_action_permission_overlay
                widgets:
                  - label:
                      align: CENTER
                      text: "OK"
                      text_font: ui_font_22
                      text_color: 0xFFFFFF

interval:
  - interval: 500ms
    then:
      - lambda: |-
          lv_label_set_text(
            id(ha_action_permission_body),
            id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::ACTION_PERMISSION_MESSAGE)
          );
          lv_label_set_text(id(blinds_page_title), id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::BLINDS));
          lv_label_set_text(id(audio_page_title), id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::AUDIO));
          lv_label_set_text(id(scenes_page_title), id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::SCENES));
      - if:
          condition:
            lambda: return id(wall_panel_controller).has_action_permission_warning();
          then:
            - lvgl.widget.show: ha_action_permission_overlay
