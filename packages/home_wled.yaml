# WLED detail page for Home
#
# HOW DISCOVERY WORKS
# -------------------
# No separate WLED entity list is required. When a Home slot contains a light,
# the wall_panel component probes the standard WLED companion entity names that
# share the same object id:
#
#   light.wled
#     -> select.wled_preset
#     -> select.wled_color_palette
#     -> select.wled_playlist
#     -> number.wled_speed
#     -> number.wled_intensity
#
# If one of those companion entities reports a state, HomeSlotState.wled_detected
# becomes true and this package redirects the normal Home detail page to the WLED
# page automatically. Ordinary lights keep the normal light detail page.
#
# First version intentionally focuses on the controls that are useful every day:
# power, brightness, quick colors, preset, palette, speed and intensity.

globals:
  # Prevent the 250 ms redirect watcher from reloading the page continuously.
  - id: home_wled_page_redirected
    type: bool
    restore_value: false
    initial_value: 'false'

lvgl:
  id: wall_panel_lvgl
  pages:
    - id: home_wled_page
      bg_color: 0x101216
      widgets:
        - button:
            x: 20
            y: 18
            width: 46
            height: 46
            bg_color: 0x181B20
            radius: 14
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: |-
                  id(active_home_slot) = 0;
                  id(home_wled_page_redirected) = false;
              - lvgl.page.show: home_page
            widgets:
              - image:
                  src: icon_arrow_left
                  align: CENTER
                  image_recolor: 0xFFFFFF
                  image_recolor_opa: 100%

        - label:
            id: home_wled_title
            x: 82
            y: 20
            width: 360
            text: "WLED"
            text_font: ui_font_34
            text_color: 0xFFFFFF
            long_mode: dot

        # Power is intentionally a large touch target. Its color follows state.
        - button:
            id: home_wled_power_button
            x: 20
            y: 82
            width: 92
            height: 56
            bg_color: 0x343A44
            radius: 16
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).toggle_home_entity(id(active_home_slot));
            widgets:
              - label:
                  id: home_wled_power_label
                  align: CENTER
                  text: "Power"
                  text_font: ui_font_18
                  text_color: 0xFFFFFF

        - label:
            id: home_wled_brightness_label
            x: 132
            y: 80
            width: 320
            text: "Brightness"
            text_font: ui_font_18
            text_color: 0xB8BDC5

        - slider:
            id: home_wled_brightness_slider
            x: 132
            y: 116
            width: 320
            min_value: 0
            max_value: 100
            value: 0
            on_release:
              - script.execute: ui_click
              - lambda: |-
                  id(wall_panel_controller).set_home_light_brightness(
                    id(active_home_slot), lv_slider_get_value(id(home_wled_brightness_slider)));

        # Quick colors use Home Assistant's color_name field, so they do not need
        # any WLED-specific API knowledge.
        - button:
            x: 20
            y: 158
            width: 48
            height: 42
            bg_color: 0xF44336
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "red");
        - button:
            x: 84
            y: 158
            width: 48
            height: 42
            bg_color: 0xFF9800
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "orange");
        - button:
            x: 148
            y: 158
            width: 48
            height: 42
            bg_color: 0xFFEB3B
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "yellow");
        - button:
            x: 212
            y: 158
            width: 48
            height: 42
            bg_color: 0x4CAF50
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "green");
        - button:
            x: 276
            y: 158
            width: 48
            height: 42
            bg_color: 0x2196F3
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "blue");
        - button:
            x: 340
            y: 158
            width: 48
            height: 42
            bg_color: 0x9C27B0
            radius: 21
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "purple");
        - button:
            x: 404
            y: 158
            width: 48
            height: 42
            bg_color: 0xFFFFFF
            radius: 21
            border_color: 0x858B94
            border_width: 1
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).set_home_wled_color(id(active_home_slot), "white");

        # WLED select entities can contain many entries. Cycling them with large
        # previous/next buttons stays usable on a wall display and avoids copying
        # the entire HA options list into the ESP32.
        - obj:
            x: 20
            y: 214
            width: 432
            height: 48
            bg_color: 0x181B20
            radius: 14
            border_width: 0
            pad_all: 0
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 52
                  height: 48
                  bg_opa: TRANSP
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: id(wall_panel_controller).home_wled_select_relative(id(active_home_slot), "preset", false);
                  widgets:
                    - image: { src: icon_arrow_left, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }
              - label:
                  id: home_wled_preset_label
                  x: 60
                  y: 5
                  width: 312
                  text: "Preset"
                  text_align: CENTER
                  text_font: ui_font_18
                  text_color: 0xFFFFFF
                  long_mode: dot
              - button:
                  x: 380
                  y: 0
                  width: 52
                  height: 48
                  bg_opa: TRANSP
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: id(wall_panel_controller).home_wled_select_relative(id(active_home_slot), "preset", true);
                  widgets:
                    - image: { src: icon_arrow_right, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

        - obj:
            x: 20
            y: 270
            width: 432
            height: 48
            bg_color: 0x181B20
            radius: 14
            border_width: 0
            pad_all: 0
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 52
                  height: 48
                  bg_opa: TRANSP
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: id(wall_panel_controller).home_wled_select_relative(id(active_home_slot), "palette", false);
                  widgets:
                    - image: { src: icon_arrow_left, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }
              - label:
                  id: home_wled_palette_label
                  x: 60
                  y: 5
                  width: 312
                  text: "Palette"
                  text_align: CENTER
                  text_font: ui_font_18
                  text_color: 0xFFFFFF
                  long_mode: dot
              - button:
                  x: 380
                  y: 0
                  width: 52
                  height: 48
                  bg_opa: TRANSP
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: id(wall_panel_controller).home_wled_select_relative(id(active_home_slot), "palette", true);
                  widgets:
                    - image: { src: icon_arrow_right, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

        - label:
            id: home_wled_speed_label
            x: 20
            y: 329
            width: 205
            text: "Speed"
            text_font: ui_font_18
            text_color: 0xB8BDC5
        - slider:
            id: home_wled_speed_slider
            x: 20
            y: 365
            width: 205
            min_value: 0
            max_value: 255
            value: 0
            on_release:
              - script.execute: ui_click
              - lambda: |-
                  id(wall_panel_controller).set_home_wled_number(
                    id(active_home_slot), "speed", lv_slider_get_value(id(home_wled_speed_slider)));

        - label:
            id: home_wled_intensity_label
            x: 247
            y: 329
            width: 205
            text: "Intensity"
            text_font: ui_font_18
            text_color: 0xB8BDC5
        - slider:
            id: home_wled_intensity_slider
            x: 247
            y: 365
            width: 205
            min_value: 0
            max_value: 255
            value: 0
            on_release:
              - script.execute: ui_click
              - lambda: |-
                  id(wall_panel_controller).set_home_wled_number(
                    id(active_home_slot), "intensity", lv_slider_get_value(id(home_wled_intensity_slider)));

interval:
  # Redirect a Home light to this page once one of the standard WLED companion
  # entities has answered. The guard makes the redirect happen only once.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              const int active = id(active_home_slot);
              if (active < 1 || active > 6) {
                id(home_wled_page_redirected) = false;
                return false;
              }
              const auto &slot = id(wall_panel_controller).get_home_slot(active);
              if (!slot.wled_detected) {
                id(home_wled_page_redirected) = false;
                return false;
              }
              return !id(home_wled_page_redirected);
          then:
            - lambda: id(home_wled_page_redirected) = true;
            - lvgl.page.show: home_wled_page

      - lambda: |-
          const int active = id(active_home_slot);
          if (active < 1 || active > 6)
            return;
          const auto &slot = id(wall_panel_controller).get_home_slot(active);
          if (!slot.wled_detected)
            return;

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          set_label(id(home_wled_title), slot.name.empty() ? std::string("WLED") : slot.name);
          set_label(id(home_wled_power_label), id(wall_panel_language).tr(slot.state == "on" ? "turn_off" : "turn_on"));
          lv_obj_set_style_bg_color(
            id(home_wled_power_button),
            lv_color_hex(slot.state == "on" ? 0xE6A700 : 0x343A44),
            LV_PART_MAIN);

          char text[96];
          snprintf(text, sizeof(text), "%s · %d%%", id(wall_panel_language).tr("brightness"), slot.brightness_pct);
          set_label(id(home_wled_brightness_label), text);
          if (slot.has_brightness && !lv_obj_has_state(id(home_wled_brightness_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_brightness_slider)) != slot.brightness_pct)
            lv_slider_set_value(id(home_wled_brightness_slider), slot.brightness_pct, LV_ANIM_OFF);

          const std::string preset = slot.wled_preset.empty() ? "--" : slot.wled_preset;
          const std::string palette = slot.wled_palette.empty() ? "--" : slot.wled_palette;
          set_label(id(home_wled_preset_label), std::string(id(wall_panel_language).tr("preset")) + " · " + preset);
          set_label(id(home_wled_palette_label), std::string(id(wall_panel_language).tr("palette")) + " · " + palette);

          snprintf(text, sizeof(text), "%s · %d", id(wall_panel_language).tr("speed"), slot.wled_speed);
          set_label(id(home_wled_speed_label), text);
          if (slot.has_wled_speed && !lv_obj_has_state(id(home_wled_speed_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_speed_slider)) != slot.wled_speed)
            lv_slider_set_value(id(home_wled_speed_slider), slot.wled_speed, LV_ANIM_OFF);

          snprintf(text, sizeof(text), "%s · %d", id(wall_panel_language).tr("intensity"), slot.wled_intensity);
          set_label(id(home_wled_intensity_label), text);
          if (slot.has_wled_intensity && !lv_obj_has_state(id(home_wled_intensity_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_intensity_slider)) != slot.wled_intensity)
            lv_slider_set_value(id(home_wled_intensity_slider), slot.wled_intensity, LV_ANIM_OFF);
