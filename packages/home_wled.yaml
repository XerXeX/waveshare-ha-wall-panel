# Shared WLED detail page
#
# WLED is an explicit special function. Home and Lights share this page.
# Short press remains a normal toggle; long press opens this detail page.
# Preset/palette options are loaded from the Home Assistant select entities and
# shown as real dropdown lists. The arrow buttons use the same local lists and
# send select.select_option, avoiding select_next/select_previous.

globals:
  # 1 = return to Home, 2 = return to Lights.
  - id: wled_return_page
    type: int
    restore_value: false
    initial_value: '1'

select:
  - platform: template
    id: home_slot1_special_function
    name: "Home · Slot 1 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]
  - platform: template
    id: home_slot2_special_function
    name: "Home · Slot 2 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]
  - platform: template
    id: home_slot3_special_function
    name: "Home · Slot 3 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]
  - platform: template
    id: home_slot4_special_function
    name: "Home · Slot 4 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]
  - platform: template
    id: home_slot5_special_function
    name: "Home · Slot 5 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]
  - platform: template
    id: home_slot6_special_function
    name: "Home · Slot 6 · 3 Special Function"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "WLED"]

script:
  - id: home_slot_short_action
    mode: restart
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: |-
              if (slot < 1 || slot > 6) return false;
              const auto &item = id(wall_panel_controller).get_home_slot(slot);
              return item.domain == "light" || item.domain == "switch" || item.domain == "input_boolean";
          then:
            - script.execute: ui_click
            - lambda: id(wall_panel_controller).toggle_home_entity(slot);
          else:
            - script.execute: ui_click
            - lambda: id(active_home_slot) = slot;
            - script.execute: home_refresh_detail
            - lvgl.page.show: home_detail_page

  - id: home_slot_long_action
    mode: restart
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: |-
              if (slot < 1 || slot > 6) return false;
              const auto &item = id(wall_panel_controller).get_home_slot(slot);
              if (item.domain != "light") return false;
              std::string special = "Auto";
              switch (slot) {
                case 1: special = id(home_slot1_special_function).current_option(); break;
                case 2: special = id(home_slot2_special_function).current_option(); break;
                case 3: special = id(home_slot3_special_function).current_option(); break;
                case 4: special = id(home_slot4_special_function).current_option(); break;
                case 5: special = id(home_slot5_special_function).current_option(); break;
                case 6: special = id(home_slot6_special_function).current_option(); break;
              }
              return special == "WLED";
          then:
            - script.execute: ui_click
            - lambda: |-
                const auto &item = id(wall_panel_controller).get_home_slot(slot);
                id(wled_return_page) = 1;
                id(active_home_slot) = 0;
                id(wall_panel_controller).set_active_wled(
                  item.entity_id, item.name.empty() ? item.entity_id : item.name);
            - lvgl.page.show: home_wled_page
          else:
            - script.execute: ui_click
            - lambda: id(active_home_slot) = slot;
            - script.execute: home_refresh_detail
            - lvgl.page.show: home_detail_page

  - id: light_slot_long_action
    mode: restart
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: |-
              if (slot < 1 || slot > 4) return false;
              switch (slot) {
                case 1: return id(light_slot1_function).current_option() == "WLED";
                case 2: return id(light_slot2_function).current_option() == "WLED";
                case 3: return id(light_slot3_function).current_option() == "WLED";
                case 4: return id(light_slot4_function).current_option() == "WLED";
              }
              return false;
          then:
            - script.execute: ui_click
            - lambda: |-
                const auto &item = id(wall_panel_controller).get_light_slot(slot);
                if (!item.configured) return;
                id(wled_return_page) = 2;
                id(active_light_slot) = 0;
                id(light_brightness_dirty) = false;
                id(wall_panel_controller).set_active_wled(
                  item.entity_id, item.name.empty() ? item.entity_id : item.name);
            - lvgl.page.show: home_wled_page
          else:
            - if:
                condition:
                  lambda: |-
                    if (slot < 1 || slot > 4) return false;
                    const auto &item = id(wall_panel_controller).get_light_slot(slot);
                    return item.function == "Auto" && item.configured && item.available && item.has_brightness;
                then:
                  - script.execute: ui_click
                  - lambda: |-
                      const auto &item = id(wall_panel_controller).get_light_slot(slot);
                      id(active_light_slot) = slot;
                      id(light_brightness_dirty) = false;
                      const char *name = item.name.empty() ? id(wall_panel_language).tr("light") : item.name.c_str();
                      if (std::strcmp(lv_label_get_text(id(light_detail_name)), name) != 0)
                        lv_label_set_text(id(light_detail_name), name);
                      char text[16];
                      snprintf(text, sizeof(text), "%d%%", item.brightness_pct);
                      if (std::strcmp(lv_label_get_text(id(light_detail_percent)), text) != 0)
                        lv_label_set_text(id(light_detail_percent), text);
                      if (lv_slider_get_value(id(light_detail_slider)) != item.brightness_pct) {
                        id(light_slider_syncing) = true;
                        lv_slider_set_value(id(light_detail_slider), item.brightness_pct, LV_ANIM_OFF);
                        id(light_slider_syncing) = false;
                      }
                  - lvgl.page.show: light_detail_page

