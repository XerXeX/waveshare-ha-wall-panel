interval:
  - interval: 250ms
    then:
      - lambda: |-
          const auto &state = id(wall_panel_controller).get_active_wled();
          if (!state.configured)
            return;

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          auto find_option_index = [](const std::string &options, const std::string &selected) -> uint32_t {
            uint32_t index = 0;
            size_t start = 0;
            while (start <= options.size()) {
              const auto end = options.find('\n', start);
              const std::string option = options.substr(
                start, end == std::string::npos ? std::string::npos : end - start);
              if (option == selected)
                return index;
              if (end == std::string::npos)
                break;
              start = end + 1;
              index++;
            }
            return 0;
          };

          auto sync_dropdown = [&](lv_obj_t *dropdown, const std::string &raw_options, const std::string &selected) {
            const std::string options = raw_options.empty() ? std::string("--") : raw_options;
            const char *current_options = lv_dropdown_get_options(dropdown);
            if (current_options == nullptr || options != current_options)
              lv_dropdown_set_options(dropdown, options.c_str());
            const uint32_t index = find_option_index(options, selected);
            if (lv_dropdown_get_selected(dropdown) != index)
              lv_dropdown_set_selected(dropdown, index);
          };

          set_label(id(home_wled_title), state.name.empty() ? std::string("WLED") : state.name);
          set_label(id(home_wled_power_label), id(wall_panel_language).tr(state.state == "on" ? "turn_off" : "turn_on"));
          set_label(id(home_wled_preset_caption), id(wall_panel_language).tr("preset"));
          set_label(id(home_wled_palette_caption), id(wall_panel_language).tr("palette"));
          lv_obj_set_style_bg_color(
            id(home_wled_power_button),
            lv_color_hex(state.state == "on" ? 0xE6A700 : 0x343A44),
            LV_PART_MAIN);

          char text[96];
          snprintf(text, sizeof(text), "%s · %d%%", id(wall_panel_language).tr("brightness"), state.brightness_pct);
          set_label(id(home_wled_brightness_label), text);
          if (state.has_brightness && !lv_obj_has_state(id(home_wled_brightness_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_brightness_slider)) != state.brightness_pct)
            lv_slider_set_value(id(home_wled_brightness_slider), state.brightness_pct, LV_ANIM_OFF);

          std::string preset_options;
          std::string palette_options;
          const std::string separator = "\n---WLED-PALETTES---\n";
          const auto separator_pos = state.playlist.find(separator);
          if (separator_pos == std::string::npos) {
            preset_options = state.playlist;
          } else {
            preset_options = state.playlist.substr(0, separator_pos);
            palette_options = state.playlist.substr(separator_pos + separator.size());
          }
          sync_dropdown(id(home_wled_preset_dropdown), preset_options, state.preset);
          sync_dropdown(id(home_wled_palette_dropdown), palette_options, state.palette);

          snprintf(text, sizeof(text), "%s · %d", id(wall_panel_language).tr("speed"), state.speed);
          set_label(id(home_wled_speed_label), text);
          if (state.has_speed && !lv_obj_has_state(id(home_wled_speed_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_speed_slider)) != state.speed)
            lv_slider_set_value(id(home_wled_speed_slider), state.speed, LV_ANIM_OFF);

          snprintf(text, sizeof(text), "%s · %d", id(wall_panel_language).tr("intensity"), state.intensity);
          set_label(id(home_wled_intensity_label), text);
          if (state.has_intensity && !lv_obj_has_state(id(home_wled_intensity_slider), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(home_wled_intensity_slider)) != state.intensity)
            lv_slider_set_value(id(home_wled_intensity_slider), state.intensity, LV_ANIM_OFF);
