script:
  - id: home_refresh_detail
    mode: restart
    then:
      - lambda: |-
          const int active = id(active_home_slot);
          if (active < 1 || active > 6)
            return;

          const auto &slot = id(wall_panel_controller).get_home_slot(active);

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };
          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible)
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto default_icon = [&](const esphome::wall_panel::HomeSlotState &item) -> esphome::image::Image * {
            if (auto *custom = id(wall_panel_controller).get_registered_icon(item.icon); custom != nullptr)
              return custom;
            if (item.domain == "light") return id(icon_lightbulb);
            if (item.domain == "switch" || item.domain == "input_boolean") return id(icon_power);
            if (item.domain == "climate") return id(icon_thermostat);
            if (item.domain == "cover") return id(icon_blinds);
            if (item.domain == "scene") return id(icon_palette_outline);
            if (item.domain == "script" || item.domain == "button" || item.domain == "input_button") return id(icon_play);
            if (item.domain == "weather") return id(icon_weather_cloudy);
            if (item.domain == "sensor") return id(icon_thermometer);
            if (item.domain == "binary_sensor") return id(icon_alert_circle);
            return id(icon_home);
          };
          auto weather_text = [&](const std::string &condition) -> std::string {
            const char *key = nullptr;
            if (condition == "sunny") key = "weather_sunny";
            else if (condition == "clear-night") key = "weather_clear_night";
            else if (condition == "cloudy") key = "weather_cloudy";
            else if (condition == "partlycloudy") key = "weather_partlycloudy";
            else if (condition == "fog") key = "weather_fog";
            else if (condition == "hail") key = "weather_hail";
            else if (condition == "lightning") key = "weather_lightning";
            else if (condition == "lightning-rainy") key = "weather_lightning_rainy";
            else if (condition == "pouring") key = "weather_pouring";
            else if (condition == "rainy") key = "weather_rainy";
            else if (condition == "snowy") key = "weather_snowy";
            else if (condition == "snowy-rainy") key = "weather_snowy_rainy";
            else if (condition == "windy" || condition == "windy-variant") key = "weather_windy";
            else if (condition == "exceptional") key = "weather_exceptional";
            return key == nullptr ? condition : std::string(id(wall_panel_language).tr(key));
          };

          set_label(id(home_detail_name), slot.name.empty() ? slot.entity_id : slot.name);
          set_label(id(home_detail_entity), slot.entity_id);
          esphome::lvgl::lv_image_set_src(id(home_detail_icon), default_icon(slot));

          set_visible(id(home_detail_toggle_button), false);
          set_visible(id(home_detail_light_slider), false);
          set_visible(id(home_detail_cover_controls), false);
          set_visible(id(home_detail_cover_slider), false);
          set_visible(id(home_detail_climate_controls), false);
          set_visible(id(home_detail_action_button), false);

          if (!slot.available) {
            set_label(id(home_detail_value), id(wall_panel_language).tr("unavailable"));
            set_label(id(home_detail_secondary), "");
            return;
          }

          std::string value = slot.state;
          std::string secondary;

          if (slot.domain == "light") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
            if (slot.has_brightness && slot.state == "on")
              secondary = std::to_string(slot.brightness_pct) + "%";
            set_visible(id(home_detail_toggle_button), true);
            set_label(id(home_detail_toggle_label), id(wall_panel_language).tr(slot.state == "on" ? "turn_off" : "turn_on"));
            if (slot.has_brightness) {
              set_visible(id(home_detail_light_slider), true);
              if (!lv_obj_has_state(id(home_detail_light_slider), LV_STATE_PRESSED) &&
                  lv_slider_get_value(id(home_detail_light_slider)) != slot.brightness_pct)
                lv_slider_set_value(id(home_detail_light_slider), slot.brightness_pct, LV_ANIM_OFF);
            }
          } else if (slot.domain == "switch" || slot.domain == "input_boolean") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
            set_visible(id(home_detail_toggle_button), true);
            set_label(id(home_detail_toggle_label), id(wall_panel_language).tr(slot.state == "on" ? "turn_off" : "turn_on"));
          } else if (slot.domain == "cover") {
            if (slot.has_position)
              value = std::to_string(slot.position_pct) + "%";
            secondary = slot.state;
            set_visible(id(home_detail_cover_controls), true);
            if (slot.has_position) {
              set_visible(id(home_detail_cover_slider), true);
              if (!lv_obj_has_state(id(home_detail_cover_slider), LV_STATE_PRESSED) &&
                  lv_slider_get_value(id(home_detail_cover_slider)) != slot.position_pct)
                lv_slider_set_value(id(home_detail_cover_slider), slot.position_pct, LV_ANIM_OFF);
            }
          } else if (slot.domain == "climate") {
            if (slot.has_current_temperature) {
              char text[24];
              snprintf(text, sizeof(text), "%.1f%s", slot.current_temperature, slot.unit.empty() ? "°" : slot.unit.c_str());
              value = text;
            }
            secondary = slot.state;
            if (!slot.hvac_action.empty() && slot.hvac_action != "idle")
              secondary += " · " + slot.hvac_action;
            set_visible(id(home_detail_climate_controls), true);
            if (slot.has_target_temperature) {
              char target[24];
              snprintf(target, sizeof(target), "%.1f%s", slot.target_temperature, slot.unit.empty() ? "°" : slot.unit.c_str());
              set_label(id(home_detail_climate_target), target);
            } else {
              set_label(id(home_detail_climate_target), "--");
            }
          } else if (slot.domain == "scene" || slot.domain == "script" || slot.domain == "button" ||
                     slot.domain == "input_button" || slot.domain == "automation") {
            value = id(wall_panel_language).tr(slot.domain == "scene" ? "scene"
                  : slot.domain == "script" ? "script"
                  : slot.domain == "automation" ? "automation" : "button");
            set_visible(id(home_detail_action_button), true);
            set_label(id(home_detail_action_label), id(wall_panel_language).tr(slot.domain == "script" ? "run"
                                                   : slot.domain == "scene" ? "activate"
                                                   : slot.domain == "automation" ? "trigger" : "press"));
          } else if (slot.domain == "weather") {
            if (slot.has_current_temperature) {
              char text[24];
              snprintf(text, sizeof(text), "%.1f%s", slot.current_temperature, slot.unit.empty() ? "°" : slot.unit.c_str());
              value = text;
            }
            secondary = weather_text(slot.state);
            if (slot.has_humidity) {
              char humidity[20];
              snprintf(humidity, sizeof(humidity), " · %.0f%%", slot.humidity);
              secondary += humidity;
            }
          } else if (slot.domain == "sensor") {
            value = slot.state + (slot.unit.empty() ? "" : " " + slot.unit);
          } else if (slot.domain == "binary_sensor") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "active" : "inactive");
          } else if (!slot.unit.empty()) {
            value = slot.state + " " + slot.unit;
          }

          set_label(id(home_detail_value), value);
          set_label(id(home_detail_secondary), secondary);

