            value: 0
            hidden: true
            on_release:
              - script.execute: ui_click
              - lambda: |-
                  id(wall_panel_controller).set_home_cover_position(
                    id(active_home_slot), lv_slider_get_value(id(home_detail_cover_slider)));

        # Climate is intentionally a full-width opaque overlay. It hides the
        # generic entity/icon/value content and leaves only the shared back button.
        - obj:
            id: home_detail_climate_controls
            x: 0
            y: 74
            width: 480
            height: 316
            bg_color: 0x101216
            bg_opa: 100%
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            hidden: true
            widgets:
              # 270° HA-style thermostat ring. Values are source temperature * 2,
              # which gives native 0.5° steps while keeping LVGL's arc integer.
              - arc:
                  id: home_climate_arc
                  x: 90
                  y: 0
                  width: 300
                  height: 300
                  min_value: 10
                  max_value: 70
                  value: 40
                  start_angle: 135
                  end_angle: 45
                  adjustable: true
                  adv_hittest: true
                  ext_click_area: 12
                  arc_color: 0x2B2D30
                  arc_width: 20
                  arc_rounded: true
                  indicator:
                    arc_color: 0xE35F21
                    arc_width: 20
                    arc_rounded: true
                  knob:
                    bg_color: 0xFFFFFF
                    bg_opa: 100%
                    border_color: 0xE35F21
                    border_width: 4
                    pad_all: 5
                  on_value:
                    - lambda: |-
                        // Update the centre value immediately while dragging, but
                        // do not call Home Assistant until the finger is released.
                        const auto &slot = id(wall_panel_controller).get_home_slot(id(active_home_slot));
                        const float source_value = x / 2.0f;
                        const std::string target_unit = id(wall_panel_temperature_unit).current_option();
                        const bool source_f = slot.unit == "°F" || slot.unit == "F";
                        const bool source_c = slot.unit == "°C" || slot.unit == "C";
                        float display_value = source_value;
                        std::string display_unit = target_unit == "Auto" ? (slot.unit.empty() ? "°" : slot.unit) : target_unit;
                        if (target_unit == "°F" && source_c)
                          display_value = source_value * 9.0f / 5.0f + 32.0f;
                        else if (target_unit == "°C" && source_f)
                          display_value = (source_value - 32.0f) * 5.0f / 9.0f;
                        char text[24];
                        snprintf(text, sizeof(text), "%.1f%s", display_value, display_unit.c_str());
                        lv_label_set_text(id(home_climate_target), text);
                  on_release:
                    - script.execute: ui_click
                    - lambda: |-
                        id(wall_panel_controller).set_home_climate_temperature(
                          id(active_home_slot), x / 2.0f);

              - label:
                  id: home_climate_status
                  x: 90
                  y: 76
                  width: 300
                  text: ""
                  text_align: CENTER
                  text_font: ui_font_18
                  text_color: 0xB8BDC5

              - label:
                  id: home_climate_target
                  x: 90
                  y: 108
                  width: 300
                  text: "--"
                  text_align: CENTER
                  text_font: ui_font_34
                  text_color: 0xFFFFFF

              - label:
                  id: home_climate_current
                  x: 90
                  y: 158
                  width: 300
                  text: "--"
                  text_align: CENTER
                  text_font: ui_font_22
                  text_color: 0x858B94

              # Keep +/- at the bottom as a precise alternative to dragging the ring.
              - button:
                  x: 154
                  y: 247
                  width: 60
                  height: 60
                  bg_color: 0x181B20
                  radius: 30
                  border_color: 0x72757A
                  border_width: 1
                  on_click:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_home_slot(id(active_home_slot));
                        const bool source_f = slot.unit == "°F" || slot.unit == "F";
                        const float fallback = source_f ? 68.0f : 20.0f;
                        const float target = slot.has_target_temperature ? slot.target_temperature
                                           : slot.has_current_temperature ? slot.current_temperature : fallback;
                        id(wall_panel_controller).set_home_climate_temperature(id(active_home_slot), target - 0.5f);
                  widgets:
                    - image: { src: icon_minus, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

              - button:
                  x: 266
                  y: 247
                  width: 60
                  height: 60
                  bg_color: 0x181B20
                  radius: 30
                  border_color: 0x72757A
                  border_width: 1
                  on_click:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_home_slot(id(active_home_slot));
                        const bool source_f = slot.unit == "°F" || slot.unit == "F";
                        const float fallback = source_f ? 68.0f : 20.0f;
                        const float target = slot.has_target_temperature ? slot.target_temperature
                                           : slot.has_current_temperature ? slot.current_temperature : fallback;
                        id(wall_panel_controller).set_home_climate_temperature(id(active_home_slot), target + 0.5f);
                  widgets:
                    - image: { src: icon_plus, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

        - button:
            id: home_detail_action_button
            x: 20
            y: 235
            width: 440
            height: 64
            bg_color: 0x343A44
            radius: 16
            border_width: 0
            hidden: true
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_home_entity(id(active_home_slot));
            widgets:
              - label:
                  id: home_detail_action_label
                  align: CENTER
                  text: ""
                  text_font: ui_font_22
                  text_color: 0xFFFFFF

interval:
  # Refresh compact cards. 250 ms keeps state feedback feeling immediate while
  # the changed-value checks avoid rewriting labels/images unnecessarily.
  - interval: 250ms
    then:
      - lambda: |-
          lv_obj_t *cards[6] = {
            id(home_slot1_card), id(home_slot2_card), id(home_slot3_card),
            id(home_slot4_card), id(home_slot5_card), id(home_slot6_card)
          };
          lv_obj_t *icons[6] = {
            id(home_slot1_icon), id(home_slot2_icon), id(home_slot3_icon),
            id(home_slot4_icon), id(home_slot5_icon), id(home_slot6_icon)
          };
          lv_obj_t *names[6] = {
            id(home_slot1_name_label), id(home_slot2_name_label), id(home_slot3_name_label),
            id(home_slot4_name_label), id(home_slot5_name_label), id(home_slot6_name_label)
          };
          lv_obj_t *states[6] = {
            id(home_slot1_state_label), id(home_slot2_state_label), id(home_slot3_state_label),
            id(home_slot4_state_label), id(home_slot5_state_label), id(home_slot6_state_label)
          };
          static esphome::image::Image *last_icons[6] = {nullptr, nullptr, nullptr, nullptr, nullptr, nullptr};

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          auto translated_state = [&](const std::string &state) -> std::string {
            const char *key = nullptr;
            if (state == "on") key = "on";
            else if (state == "off") key = "off";
            else if (state == "open") key = "open";
            else if (state == "closed") key = "closed";
            else if (state == "opening") key = "opening";
            else if (state == "closing") key = "closing";
            else if (state == "idle") key = "idle";
            else if (state == "heat") key = "heat";
            else if (state == "cool") key = "cool";
            else if (state == "dry") key = "dry";
            else if (state == "fan_only" || state == "fan-only") key = "fan_only";
            else if (state == "heating") key = "heating";
            else if (state == "cooling") key = "cooling";
            else if (state == "drying") key = "drying";
            else if (state == "fan") key = "fan";
            return key == nullptr ? state : std::string(id(wall_panel_language).tr(key));
          };

          auto temperature_for_display = [&](float value, const std::string &source_unit,
                                             std::string &display_unit) -> float {
            const std::string target = id(wall_panel_temperature_unit).current_option();
            const bool source_f = source_unit == "°F" || source_unit == "F";
            const bool source_c = source_unit == "°C" || source_unit == "C";
            if (target == "Auto") {
              display_unit = source_unit.empty() ? "°" : source_unit;
              return value;
            }
            display_unit = target;
            if (target == "°F" && source_c) return value * 9.0f / 5.0f + 32.0f;
            if (target == "°C" && source_f) return (value - 32.0f) * 5.0f / 9.0f;
            return value;
          };

          auto default_icon = [&](const esphome::wall_panel::HomeSlotState &item) -> esphome::image::Image * {
            if (auto *custom = id(wall_panel_controller).get_registered_icon(item.icon); custom != nullptr)
              return custom;
            if (item.domain == "light") return id(icon_lightbulb);
            if (item.domain == "switch" || item.domain == "input_boolean") return id(icon_power);
            if (item.domain == "climate") return id(icon_thermostat);
            if (item.domain == "cover") return id(icon_blinds);
            if (item.domain == "scene") return id(icon_palette_outline);
            if (item.domain == "script" || item.domain == "button" || item.domain == "input_button") return id(icon_play);
            if (item.domain == "weather") return id(icon_weather_cloudy);
            if (item.domain == "sensor") return id(icon_thermometer);
            if (item.domain == "binary_sensor") return id(icon_alert_circle);
            return id(icon_home);
          };

          auto weather_text = [&](const std::string &condition) -> std::string {
            const char *key = nullptr;
            if (condition == "sunny") key = "weather_sunny";
            else if (condition == "clear-night") key = "weather_clear_night";
            else if (condition == "cloudy") key = "weather_cloudy";
            else if (condition == "partlycloudy") key = "weather_partlycloudy";
            else if (condition == "fog") key = "weather_fog";
            else if (condition == "hail") key = "weather_hail";
            else if (condition == "lightning") key = "weather_lightning";
            else if (condition == "lightning-rainy") key = "weather_lightning_rainy";
            else if (condition == "pouring") key = "weather_pouring";
            else if (condition == "rainy") key = "weather_rainy";
            else if (condition == "snowy") key = "weather_snowy";
            else if (condition == "snowy-rainy") key = "weather_snowy_rainy";
            else if (condition == "windy" || condition == "windy-variant") key = "weather_windy";
            else if (condition == "exceptional") key = "weather_exceptional";
            return key == nullptr ? condition : std::string(id(wall_panel_language).tr(key));
          };

          set_label(id(home_page_title), id(wall_panel_language).tr("home"));

          int visible = 0;
          for (int i = 0; i < 6; i++) {
            const auto &slot = id(wall_panel_controller).get_home_slot(i + 1);
            if (!slot.configured) {
              lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            const int column = visible % 2;
            const int row = visible / 2;
            lv_obj_set_pos(cards[i], 20 + column * 230, 72 + row * 98);
            visible++;

            // Custom Name is user data; do not translate it.
            set_label(names[i], slot.name.empty() ? slot.entity_id : slot.name);

            std::string state_text;
            if (!slot.available) {
              state_text = id(wall_panel_language).tr("unavailable");
            } else if (slot.domain == "light" || slot.domain == "switch" || slot.domain == "input_boolean") {
              state_text = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
              if (slot.domain == "light" && slot.has_brightness && slot.state == "on")
                state_text += " · " + std::to_string(slot.brightness_pct) + "%";
            } else if (slot.domain == "cover") {
              if (slot.has_position)
                state_text = std::to_string(slot.position_pct) + "%";
              else
                state_text = translated_state(slot.state);
            } else if (slot.domain == "climate" && slot.has_current_temperature) {
              std::string display_unit;
              const float display_temperature = temperature_for_display(
                  slot.current_temperature, slot.unit, display_unit);
              char text[32];
              snprintf(text, sizeof(text), "%.1f%s", display_temperature, display_unit.c_str());
              state_text = text;
            } else if (slot.domain == "weather" && slot.has_current_temperature) {
              std::string display_unit;
              const float display_temperature = temperature_for_display(
                  slot.current_temperature, slot.unit, display_unit);
              char text[48];
              const std::string condition = weather_text(slot.state);
              snprintf(text, sizeof(text), "%.1f%s · %s", display_temperature,
                       display_unit.c_str(), condition.c_str());
              state_text = text;
            } else if (slot.domain == "sensor") {
              state_text = slot.state + (slot.unit.empty() ? "" : " " + slot.unit);
            } else if (slot.domain == "binary_sensor") {
              state_text = id(wall_panel_language).tr(slot.state == "on" ? "active" : "inactive");
            } else if (slot.domain == "scene") {
              state_text = id(wall_panel_language).tr("scene");
            } else if (slot.domain == "script") {
              state_text = id(wall_panel_language).tr("script");
            } else {
              state_text = translated_state(slot.state);
            }
            set_label(states[i], state_text);

            auto *image = default_icon(slot);
            if (last_icons[i] != image) {
              esphome::lvgl::lv_image_set_src(icons[i], image);
              last_icons[i] = image;
            }

            const bool active_state = slot.state == "on" || slot.state == "open" || slot.state == "opening";
            lv_obj_set_style_image_recolor(icons[i], lv_color_hex(active_state ? 0xFFD54F : 0x858B94), LV_PART_MAIN);
          }

      # Keep an open detail page synchronized with live HA state changes.
      - if:
          condition:
            lambda: return id(active_home_slot) >= 1 && id(active_home_slot) <= 6;
          then:
            - script.execute: home_refresh_detail
