              - label: { id: home_slot6_name_label, x: 68, y: 15, width: 126, text: "Home 6", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: home_slot6_state_label, x: 68, y: 50, width: 126, text: "--", text_font: ui_font_18, text_color: 0x858B94 }

