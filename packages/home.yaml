                  widgets:
                    - image: { src: icon_arrow_up, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

        - slider:
            id: home_detail_cover_slider
            x: 30
            y: 315
            width: 420
            min_value: 0
