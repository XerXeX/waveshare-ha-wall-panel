script:
  # Rebuild the generic detail page for the currently selected Home slot.
  # Weather adds its own overlay in packages/home_weather.yaml. Climate uses an
  # opaque thermostat overlay below, while keeping the same detail page/back nav.
  - id: home_refresh_detail
    mode: restart
    then:
      - lambda: |-
          const int active = id(active_home_slot);
          if (active < 1 || active > 6)
            return;

          const auto &slot = id(wall_panel_controller).get_home_slot(active);

          // Update only when text changed to reduce LVGL redraw work.
          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };
          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible)
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };

          // Convert known HA state strings to translation keys. Unknown states
          // intentionally fall back to the original string so custom integrations
          // remain useful instead of displaying a blank value.
          auto translated_state = [&](const std::string &state) -> std::string {
            const char *key = nullptr;
            if (state == "on") key = "on";
            else if (state == "off") key = "off";
            else if (state == "open") key = "open";
            else if (state == "closed") key = "closed";
            else if (state == "opening") key = "opening";
            else if (state == "closing") key = "closing";
            else if (state == "idle") key = "idle";
            else if (state == "heat") key = "heat";
            else if (state == "cool") key = "cool";
            else if (state == "dry") key = "dry";
            else if (state == "fan_only" || state == "fan-only") key = "fan_only";
            else if (state == "heating") key = "heating";
            else if (state == "cooling") key = "cooling";
            else if (state == "drying") key = "drying";
            else if (state == "fan") key = "fan";
            return key == nullptr ? state : std::string(id(wall_panel_language).tr(key));
          };

          auto temperature_for_display = [&](float value, const std::string &source_unit,
                                             std::string &display_unit) -> float {
            const std::string target = id(wall_panel_temperature_unit).current_option();
            const bool source_f = source_unit == "°F" || source_unit == "F";
            const bool source_c = source_unit == "°C" || source_unit == "C";

            if (target == "Auto") {
              display_unit = source_unit.empty() ? "°" : source_unit;
              return value;
            }
            display_unit = target;
            if (target == "°F" && source_c) return value * 9.0f / 5.0f + 32.0f;
            if (target == "°C" && source_f) return (value - 32.0f) * 5.0f / 9.0f;
            return value;
          };

          auto default_icon = [&](const esphome::wall_panel::HomeSlotState &item) -> esphome::image::Image * {
            if (auto *custom = id(wall_panel_controller).get_registered_icon(item.icon); custom != nullptr)
              return custom;
            if (item.domain == "light") return id(icon_lightbulb);
            if (item.domain == "switch" || item.domain == "input_boolean") return id(icon_power);
            if (item.domain == "climate") return id(icon_thermostat);
            if (item.domain == "cover") return id(icon_blinds);
            if (item.domain == "scene") return id(icon_palette_outline);
            if (item.domain == "script" || item.domain == "button" || item.domain == "input_button") return id(icon_play);
            if (item.domain == "weather") return id(icon_weather_cloudy);
            if (item.domain == "sensor") return id(icon_thermometer);
            if (item.domain == "binary_sensor") return id(icon_alert_circle);
            return id(icon_home);
          };

          auto weather_text = [&](const std::string &condition) -> std::string {
            const char *key = nullptr;
            if (condition == "sunny") key = "weather_sunny";
            else if (condition == "clear-night") key = "weather_clear_night";
            else if (condition == "cloudy") key = "weather_cloudy";
            else if (condition == "partlycloudy") key = "weather_partlycloudy";
            else if (condition == "fog") key = "weather_fog";
            else if (condition == "hail") key = "weather_hail";
            else if (condition == "lightning") key = "weather_lightning";
            else if (condition == "lightning-rainy") key = "weather_lightning_rainy";
            else if (condition == "pouring") key = "weather_pouring";
            else if (condition == "rainy") key = "weather_rainy";
            else if (condition == "snowy") key = "weather_snowy";
            else if (condition == "snowy-rainy") key = "weather_snowy_rainy";
            else if (condition == "windy" || condition == "windy-variant") key = "weather_windy";
            else if (condition == "exceptional") key = "weather_exceptional";
            return key == nullptr ? condition : std::string(id(wall_panel_language).tr(key));
          };

          // Climate gets a deliberately minimal header: the thermostat itself
          // carries all useful information, so only the back button remains.
          const bool is_climate = slot.domain == "climate";
          set_label(id(home_detail_name), is_climate ? "" : (slot.name.empty() ? slot.entity_id : slot.name));
          set_label(id(home_detail_entity), is_climate ? "" : slot.entity_id);
          esphome::lvgl::lv_image_set_src(id(home_detail_icon), default_icon(slot));

          // Hide every domain-specific control first; the matching domain block
          // below enables only the controls that make sense for this entity.
          set_visible(id(home_detail_toggle_button), false);
          set_visible(id(home_detail_light_slider), false);
          set_visible(id(home_detail_cover_controls), false);
          set_visible(id(home_detail_cover_slider), false);
          set_visible(id(home_detail_climate_controls), false);
          set_visible(id(home_detail_action_button), false);

          if (!slot.available) {
            set_label(id(home_detail_value), id(wall_panel_language).tr("unavailable"));
            set_label(id(home_detail_secondary), "");
            return;
          }

          std::string value = slot.state;
          std::string secondary;

          if (slot.domain == "light") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
            if (slot.has_brightness && slot.state == "on")
              secondary = std::to_string(slot.brightness_pct) + "%";
            set_visible(id(home_detail_toggle_button), true);
            set_label(id(home_detail_toggle_label), id(wall_panel_language).tr(slot.state == "on" ? "turn_off" : "turn_on"));
            if (slot.has_brightness) {
              set_visible(id(home_detail_light_slider), true);
              if (!lv_obj_has_state(id(home_detail_light_slider), LV_STATE_PRESSED) &&
                  lv_slider_get_value(id(home_detail_light_slider)) != slot.brightness_pct)
                lv_slider_set_value(id(home_detail_light_slider), slot.brightness_pct, LV_ANIM_OFF);
            }
          } else if (slot.domain == "switch" || slot.domain == "input_boolean") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
            set_visible(id(home_detail_toggle_button), true);
            set_label(id(home_detail_toggle_label), id(wall_panel_language).tr(slot.state == "on" ? "turn_off" : "turn_on"));
          } else if (slot.domain == "cover") {
            if (slot.has_position)
              value = std::to_string(slot.position_pct) + "%";
            secondary = translated_state(slot.state);
            set_visible(id(home_detail_cover_controls), true);
            if (slot.has_position) {
              set_visible(id(home_detail_cover_slider), true);
              if (!lv_obj_has_state(id(home_detail_cover_slider), LV_STATE_PRESSED) &&
                  lv_slider_get_value(id(home_detail_cover_slider)) != slot.position_pct)
                lv_slider_set_value(id(home_detail_cover_slider), slot.position_pct, LV_ANIM_OFF);
            }
          } else if (slot.domain == "climate") {
            set_visible(id(home_detail_climate_controls), true);

            // Status sits inside the thermostat ring. Prefer the active HVAC
            // action (Heating/Cooling) over the configured mode (Heat/Cool).
            const std::string climate_status =
                (!slot.hvac_action.empty() && slot.hvac_action != "idle") ? slot.hvac_action : slot.state;
            set_label(id(home_climate_status), translated_state(climate_status));

            // The arc uses integers but climate targets commonly use 0.5° steps.
            // Store source temperature * 2 in the arc, then convert only the text
            // shown to the user. Service calls therefore remain in HA's source unit.
            const bool source_f = slot.unit == "°F" || slot.unit == "F";
            lv_arc_set_range(id(home_climate_arc), source_f ? 80 : 10, source_f ? 190 : 70);

            if (slot.has_target_temperature) {
              const int arc_target = static_cast<int>(std::lround(slot.target_temperature * 2.0f));
              if (!lv_obj_has_state(id(home_climate_arc), LV_STATE_PRESSED)) {
                if (lv_arc_get_value(id(home_climate_arc)) != arc_target)
                  lv_arc_set_value(id(home_climate_arc), arc_target);

                std::string display_unit;
                const float display_target = temperature_for_display(
                    slot.target_temperature, slot.unit, display_unit);
                char target[24];
                snprintf(target, sizeof(target), "%.1f%s", display_target, display_unit.c_str());
                set_label(id(home_climate_target), target);
              }
            } else {
              set_label(id(home_climate_target), "--");
            }

            // Current temperature is intentionally just the number: no caption
            // and no unit, keeping the centre of the thermostat visually quiet.
            if (slot.has_current_temperature) {
              std::string display_unit;
              const float display_current = temperature_for_display(
                  slot.current_temperature, slot.unit, display_unit);
              char current[20];
              snprintf(current, sizeof(current), "%.1f", display_current);
              set_label(id(home_climate_current), current);
            } else {
              set_label(id(home_climate_current), "--");
            }

            // HA-like color cue: orange for heat, blue for cool, neutral otherwise.
            uint32_t accent = 0x858B94;
            if (slot.state == "heat" || slot.hvac_action == "heating")
              accent = 0xE35F21;
            else if (slot.state == "cool" || slot.hvac_action == "cooling")
              accent = 0x42A5F5;
            lv_obj_set_style_arc_color(id(home_climate_arc), lv_color_hex(accent), LV_PART_INDICATOR);
            lv_obj_set_style_border_color(id(home_climate_arc), lv_color_hex(accent), LV_PART_KNOB);
          } else if (slot.domain == "scene" || slot.domain == "script" || slot.domain == "button" ||
                     slot.domain == "input_button" || slot.domain == "automation") {
            value = id(wall_panel_language).tr(slot.domain == "scene" ? "scene"
                  : slot.domain == "script" ? "script"
                  : slot.domain == "automation" ? "automation" : "button");
            set_visible(id(home_detail_action_button), true);
            set_label(id(home_detail_action_label), id(wall_panel_language).tr(slot.domain == "script" ? "run"
                                                   : slot.domain == "scene" ? "activate"
                                                   : slot.domain == "automation" ? "trigger" : "press"));
          } else if (slot.domain == "weather") {
            if (slot.has_current_temperature) {
              std::string display_unit;
              const float display_temperature = temperature_for_display(
                  slot.current_temperature, slot.unit, display_unit);
              char text[24];
              snprintf(text, sizeof(text), "%.1f%s", display_temperature, display_unit.c_str());
              value = text;
            }
            secondary = weather_text(slot.state);
            if (slot.has_humidity) {
              char humidity[20];
              snprintf(humidity, sizeof(humidity), " · %.0f%%", slot.humidity);
              secondary += humidity;
            }
          } else if (slot.domain == "sensor") {
            // Generic sensor state is source data. Do not translate arbitrary
            // values because integrations may use meaningful custom strings.
            value = slot.state + (slot.unit.empty() ? "" : " " + slot.unit);
          } else if (slot.domain == "binary_sensor") {
            value = id(wall_panel_language).tr(slot.state == "on" ? "active" : "inactive");
          } else if (!slot.unit.empty()) {
            value = slot.state + " " + slot.unit;
          }

          set_label(id(home_detail_value), value);
          set_label(id(home_detail_secondary), secondary);

lvgl:
  id: wall_panel_lvgl
  pages:
    # -------------------------------------------------------------------------
    # Main Home grid
    # -------------------------------------------------------------------------
    - id: home_page
      bg_color: 0x101216
      widgets:
        - label:
            id: home_page_title
            x: 20
            y: 18
            text: ""
            text_font: ui_font_34
            text_color: 0xFFFFFF

        # The six card definitions are intentionally repetitive. The interval
        # below packs only configured cards into a 2-column grid and updates their
        # labels/icons from HomeSlotState.
        - button:
            id: home_slot1_card
            width: 210
            height: 90
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(active_home_slot) = 1;
              - script.execute: home_refresh_detail
              - lvgl.page.show: home_detail_page
            widgets:
              - image:
                  id: home_slot1_icon
                  src: icon_home
                  x: 14
                  y: 24
                  image_recolor: 0x858B94
                  image_recolor_opa: 100%
              - label:
                  id: home_slot1_name_label
                  x: 68
                  y: 15
                  width: 126
                  text: "Home 1"
                  text_font: ui_font_22
                  text_color: 0xFFFFFF
              - label:
                  id: home_slot1_state_label
                  x: 68
                  y: 50
                  width: 126
                  text: "--"
                  text_font: ui_font_18
                  text_color: 0x858B94

        - button:
            id: home_slot2_card
            width: 210
            height: 90
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            on_click:
              - script.execute: ui_click
              - lambda: id(active_home_slot) = 2;
              - script.execute: home_refresh_detail
              - lvgl.page.show: home_detail_page
            widgets:
              - image: { id: home_slot2_icon, src: icon_home, x: 14, y: 24, image_recolor: 0x858B94, image_recolor_opa: 100% }
              - label: { id: home_slot2_name_label, x: 68, y: 15, width: 126, text: "Home 2", text_font: ui_font_22, text_color: 0xFFFFFF }
              - label: { id: home_slot2_state_label, x: 68, y: 50, width: 126, text: "--", text_font: ui_font_18, text_color: 0x858B94 }

        - button:
            id: home_slot3_card
