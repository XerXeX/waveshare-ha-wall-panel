                        id(wall_panel_controller).set_home_climate_temperature(id(active_home_slot), target - 0.5f);
                  widgets:
                    - image: { src: icon_minus, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }
              - label:
                  id: home_detail_climate_target
                  x: 105
                  y: 18
                  width: 230
                  text: "--"
                  text_align: CENTER
                  text_font: ui_font_34
                  text_color: 0xFFFFFF
              - button:
                  x: 350
                  y: 0
                  width: 90
                  height: 70
                  bg_color: 0x343A44
                  radius: 16
                  border_width: 0
                  on_click:
                    - script.execute: ui_click
                    - lambda: |-
                        const auto &slot = id(wall_panel_controller).get_home_slot(id(active_home_slot));
                        float target = slot.has_target_temperature ? slot.target_temperature
                                     : slot.has_current_temperature ? slot.current_temperature : 20.0f;
                        id(wall_panel_controller).set_home_climate_temperature(id(active_home_slot), target + 0.5f);
                  widgets:
                    - image: { src: icon_plus, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: 100% }

        - button:
            id: home_detail_action_button
            x: 20
            y: 235
            width: 440
            height: 64
            bg_color: 0x343A44
            radius: 16
            border_width: 0
            hidden: true
            on_click:
              - script.execute: ui_click
              - lambda: id(wall_panel_controller).activate_home_entity(id(active_home_slot));
            widgets:
              - label:
                  id: home_detail_action_label
                  align: CENTER
                  text: "Activate"
                  text_font: ui_font_22
                  text_color: 0xFFFFFF

interval:
  - interval: 250ms
    then:
      - lambda: |-
          lv_obj_t *cards[6] = {
            id(home_slot1_card), id(home_slot2_card), id(home_slot3_card),
            id(home_slot4_card), id(home_slot5_card), id(home_slot6_card)
          };
          lv_obj_t *icons[6] = {
            id(home_slot1_icon), id(home_slot2_icon), id(home_slot3_icon),
            id(home_slot4_icon), id(home_slot5_icon), id(home_slot6_icon)
          };
          lv_obj_t *names[6] = {
            id(home_slot1_name_label), id(home_slot2_name_label), id(home_slot3_name_label),
            id(home_slot4_name_label), id(home_slot5_name_label), id(home_slot6_name_label)
          };
          lv_obj_t *states[6] = {
            id(home_slot1_state_label), id(home_slot2_state_label), id(home_slot3_state_label),
            id(home_slot4_state_label), id(home_slot5_state_label), id(home_slot6_state_label)
          };
          static esphome::image::Image *last_icons[6] = {nullptr, nullptr, nullptr, nullptr, nullptr, nullptr};

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };
          auto default_icon = [&](const esphome::wall_panel::HomeSlotState &item) -> esphome::image::Image * {
            if (auto *custom = id(wall_panel_controller).get_registered_icon(item.icon); custom != nullptr)
              return custom;
            if (item.domain == "light") return id(icon_lightbulb);
            if (item.domain == "switch" || item.domain == "input_boolean") return id(icon_power);
            if (item.domain == "climate") return id(icon_thermostat);
            if (item.domain == "cover") return id(icon_blinds);
            if (item.domain == "scene") return id(icon_palette_outline);
            if (item.domain == "script" || item.domain == "button" || item.domain == "input_button") return id(icon_play);
            if (item.domain == "weather") return id(icon_weather_cloudy);
            if (item.domain == "sensor") return id(icon_thermometer);
            if (item.domain == "binary_sensor") return id(icon_alert_circle);
            return id(icon_home);
          };
          auto weather_text = [&](const std::string &condition) -> std::string {
            const char *key = nullptr;
            if (condition == "sunny") key = "weather_sunny";
            else if (condition == "clear-night") key = "weather_clear_night";
            else if (condition == "cloudy") key = "weather_cloudy";
            else if (condition == "partlycloudy") key = "weather_partlycloudy";
            else if (condition == "fog") key = "weather_fog";
            else if (condition == "hail") key = "weather_hail";
            else if (condition == "lightning") key = "weather_lightning";
            else if (condition == "lightning-rainy") key = "weather_lightning_rainy";
            else if (condition == "pouring") key = "weather_pouring";
            else if (condition == "rainy") key = "weather_rainy";
            else if (condition == "snowy") key = "weather_snowy";
            else if (condition == "snowy-rainy") key = "weather_snowy_rainy";
            else if (condition == "windy" || condition == "windy-variant") key = "weather_windy";
            else if (condition == "exceptional") key = "weather_exceptional";
            return key == nullptr ? condition : std::string(id(wall_panel_language).tr(key));
          };

          set_label(id(home_page_title), id(wall_panel_language).tr("home"));

          int visible = 0;
          for (int i = 0; i < 6; i++) {
            const auto &slot = id(wall_panel_controller).get_home_slot(i + 1);
            if (!slot.configured) {
              lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            const int column = visible % 2;
            const int row = visible / 2;
            lv_obj_set_pos(cards[i], 20 + column * 230, 72 + row * 98);
            visible++;

            set_label(names[i], slot.name.empty() ? slot.entity_id : slot.name);

            std::string state_text;
            if (!slot.available) {
              state_text = id(wall_panel_language).tr("unavailable");
            } else if (slot.domain == "light" || slot.domain == "switch" || slot.domain == "input_boolean") {
              state_text = id(wall_panel_language).tr(slot.state == "on" ? "on" : "off");
              if (slot.domain == "light" && slot.has_brightness && slot.state == "on")
                state_text += " · " + std::to_string(slot.brightness_pct) + "%";
            } else if (slot.domain == "cover" && slot.has_position) {
              state_text = std::to_string(slot.position_pct) + "%";
            } else if (slot.domain == "climate" && slot.has_current_temperature) {
              char text[32];
              snprintf(text, sizeof(text), "%.1f%s", slot.current_temperature, slot.unit.empty() ? "°" : slot.unit.c_str());
              state_text = text;
            } else if (slot.domain == "weather" && slot.has_current_temperature) {
              char text[32];
              const std::string condition = weather_text(slot.state);
              snprintf(text, sizeof(text), "%.1f%s · %s", slot.current_temperature,
                       slot.unit.empty() ? "°" : slot.unit.c_str(), condition.c_str());
              state_text = text;
            } else if (slot.domain == "sensor") {
              state_text = slot.state + (slot.unit.empty() ? "" : " " + slot.unit);
            } else if (slot.domain == "binary_sensor") {
              state_text = id(wall_panel_language).tr(slot.state == "on" ? "active" : "inactive");
            } else if (slot.domain == "scene") {
              state_text = id(wall_panel_language).tr("scene");
            } else if (slot.domain == "script") {
              state_text = id(wall_panel_language).tr("script");
            } else {
              state_text = slot.state;
            }
            set_label(states[i], state_text);

            auto *image = default_icon(slot);
            if (last_icons[i] != image) {
              esphome::lvgl::lv_image_set_src(icons[i], image);
              last_icons[i] = image;
            }

            const bool active = slot.state == "on" || slot.state == "open" || slot.state == "opening";
            lv_obj_set_style_image_recolor(icons[i], lv_color_hex(active ? 0xFFD54F : 0x858B94), LV_PART_MAIN);
          }

      - if:
          condition:
            lambda: return id(active_home_slot) >= 1 && id(active_home_slot) <= 6;
          then:
            - script.execute: home_refresh_detail
