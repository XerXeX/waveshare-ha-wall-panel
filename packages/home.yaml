# Configurable Home dashboard
#
# PURPOSE
# -------
# Home is the mixed-entity dashboard. Six configurable slots can point at many
# Home Assistant domains (light, switch, climate, cover, scene, script, weather,
# sensor, binary_sensor, ...). The custom wall_panel component subscribes to the
# selected entities and stores their latest state/attributes in HomeSlotState;
# this file is responsible only for rendering those states and sending actions.
#
# USER DATA VS. TRANSLATION
# -------------------------
# Values entered into Home · Slot N · Name are USER DATA and are never translated.
# A user who types "Stue", "Sofa lamp" or "Roberto" should always see exactly that
# text. Only panel-owned UI words and well-known Home Assistant state strings are
# passed through wall_panel_language.tr(...).
#
# UNITS
# -----
# Climate/weather temperatures respect wall_panel_temperature_unit from
# Settings. "Auto" keeps the source unit supplied by Home Assistant.
# Conversion is display-only; climate service calls still use the original source
# values stored in HomeSlotState.

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // Push restored YAML text-entity configuration into the C++ slot
            // model. After this, the component subscribes to the chosen HA IDs.
            id(wall_panel_controller).set_home_name(1, id(home_slot1_name).state);
            id(wall_panel_controller).set_home_entity(1, id(home_slot1_entity).state);
            id(wall_panel_controller).set_home_name(2, id(home_slot2_name).state);
            id(wall_panel_controller).set_home_entity(2, id(home_slot2_entity).state);
            id(wall_panel_controller).set_home_name(3, id(home_slot3_name).state);
            id(wall_panel_controller).set_home_entity(3, id(home_slot3_entity).state);
            id(wall_panel_controller).set_home_name(4, id(home_slot4_name).state);
            id(wall_panel_controller).set_home_entity(4, id(home_slot4_entity).state);
            id(wall_panel_controller).set_home_name(5, id(home_slot5_name).state);
            id(wall_panel_controller).set_home_entity(5, id(home_slot5_entity).state);
            id(wall_panel_controller).set_home_name(6, id(home_slot6_name).state);
            id(wall_panel_controller).set_home_entity(6, id(home_slot6_entity).state);

globals:
  # 0 = no detail page selected. 1..6 = active Home slot.
  - id: active_home_slot
    type: int
    restore_value: false
    initial_value: '0'

