# Home Assistant sub-device organization
#
# The physical wall panel stays as the parent device. Page-specific entities are
# grouped into logical child devices so the Home Assistant device page remains
# easy to navigate.

esphome:
  devices:
    - id: lights_device
      name: "Lights"

    - id: blinds_device
      name: "Blinds"

    - id: audio_device
      name: "Audio"

    - id: scenes_device
      name: "Scenes"

    - id: settings_device
      name: "Settings"

# -----------------------------------------------------------------------------
# Settings
# -----------------------------------------------------------------------------

select:
  - id: !extend wall_panel_language
    device_id: settings_device

  - id: !extend wall_panel_rotation
    device_id: settings_device

  - id: !extend wall_panel_clock_style
    device_id: settings_device

  - id: !extend wall_panel_time_format
    device_id: settings_device

number:
  - id: !extend wall_panel_screensaver_timeout
    device_id: settings_device

  - id: !extend wall_panel_screensaver_brightness
    device_id: settings_device

light:
  - id: !extend lcd_backlight
    name: "Backlight"
    device_id: settings_device

# -----------------------------------------------------------------------------
# Lights
# -----------------------------------------------------------------------------

text:
  - id: !extend light_slot1_name
    name: "Slot 1 · Name"
    device_id: lights_device
  - id: !extend light_slot1_entity
