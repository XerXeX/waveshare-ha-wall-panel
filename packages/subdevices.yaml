# Home Assistant sub-device organization
#
# The physical wall panel stays as the parent device. Page-specific entities are
# grouped into logical child devices so the Home Assistant device page remains
# easy to navigate.
#
# Do not rename page entities to generic "Slot ..." names here. ESPHome derives
# each entity key from its name, so duplicate names across sub-devices can collide
# even though Home Assistant shows them under different child devices.

esphome:
  on_boot:
    - priority: -90
      then:
        - lambda: |-
            auto publish_name = [](auto *entity, const char *fallback) {
              const std::string value = entity->state.empty() ? std::string(fallback) : entity->state;
              entity->publish_state(value);
            };
            auto publish_entity = [](auto *entity) {
              entity->publish_state(entity->state);
            };

            publish_name(id(home_slot1_name), "Home 1");
            publish_entity(id(home_slot1_entity));
            publish_name(id(home_slot2_name), "Home 2");
            publish_entity(id(home_slot2_entity));
            publish_name(id(home_slot3_name), "Home 3");
            publish_entity(id(home_slot3_entity));
            publish_name(id(home_slot4_name), "Home 4");
            publish_entity(id(home_slot4_entity));
            publish_name(id(home_slot5_name), "Home 5");
            publish_entity(id(home_slot5_entity));
            publish_name(id(home_slot6_name), "Home 6");
            publish_entity(id(home_slot6_entity));

  devices:
    - id: home_device
      name: "Home"

    - id: lights_device
      name: "Lights"

    - id: blinds_device
      name: "Blinds"

    - id: scenes_device
      name: "Scenes"

    - id: settings_device
      name: "Settings"

select:
  # Settings
  - id: !extend wall_panel_language
    device_id: settings_device

  - id: !extend wall_panel_rotation
    device_id: settings_device

  - id: !extend wall_panel_default_page
    device_id: settings_device

  - id: !extend wall_panel_clock_style
    device_id: settings_device

  - id: !extend wall_panel_time_format
    device_id: settings_device

  # Lights
  - id: !extend light_slot1_function
    device_id: lights_device
  - id: !extend light_slot2_function
    device_id: lights_device
  - id: !extend light_slot3_function
    device_id: lights_device
  - id: !extend light_slot4_function
    device_id: lights_device

  # Scenes
  - id: !extend scene_slot1_function
    device_id: scenes_device
  - id: !extend scene_slot2_function
    device_id: scenes_device
  - id: !extend scene_slot3_function
    device_id: scenes_device
  - id: !extend scene_slot4_function
