# Home Assistant sub-device organization
#
# The physical wall panel stays as the parent device. Page-specific entities are
# grouped into logical child devices so the Home Assistant device page remains
# easy to navigate.
#
# IMPORTANT NAMING RULE
# ---------------------
# Do not rename page entities to generic "Slot ..." names here. ESPHome derives
# each entity key from its name, so duplicate names across sub-devices can collide
# even though Home Assistant shows them under different child devices.
#
# USER DATA RULE
# --------------
# Values entered into the various "... Name" text entities are user content.
# They are deliberately NOT translated by the wall-panel language system. If the
# user calls a card "Sofa lamp", "Roberto" or "Stue", that exact text is kept.
#
# UNIT SETTINGS
# -------------
# The unit selectors are DEFINED in this file rather than merely extended here.
# This is intentional. ESPHome resolves !extend while merging packages, and a
# remote configuration may still use an older package list that does not include
# a newly-added units.yaml. Defining the selectors here makes the unit feature
# self-contained and backwards-compatible with existing package lists.

esphome:
  on_boot:
    - priority: -90
      then:
        - lambda: |-
            // Re-publish restored Home text entities after boot. This makes
            // Home Assistant receive their current values immediately instead
            // of waiting for the user to edit each field again.
            auto publish_name = [](auto *entity, const char *fallback) {
              const std::string value = entity->state.empty() ? std::string(fallback) : entity->state;
              entity->publish_state(value);
            };
            auto publish_entity = [](auto *entity) {
              entity->publish_state(entity->state);
            };

            publish_name(id(home_slot1_name), "Home 1");
            publish_entity(id(home_slot1_entity));
            publish_name(id(home_slot2_name), "Home 2");
            publish_entity(id(home_slot2_entity));
            publish_name(id(home_slot3_name), "Home 3");
            publish_entity(id(home_slot3_entity));
            publish_name(id(home_slot4_name), "Home 4");
            publish_entity(id(home_slot4_entity));
            publish_name(id(home_slot5_name), "Home 5");
            publish_entity(id(home_slot5_entity));
            publish_name(id(home_slot6_name), "Home 6");
            publish_entity(id(home_slot6_entity));

  # Logical Home Assistant child devices. These do not represent additional
  # physical hardware; they only keep configuration entities grouped cleanly.
  devices:
    - id: home_device
      name: "Home"

    - id: lights_device
      name: "Lights"

    - id: blinds_device
      name: "Blinds"

    - id: scenes_device
      name: "Scenes"

    - id: settings_device
      name: "Settings"

select:
  # ---------------------------------------------------------------------------
  # Settings inherited from other packages
  # ---------------------------------------------------------------------------
  - id: !extend wall_panel_language
    device_id: settings_device

  - id: !extend wall_panel_rotation
    device_id: settings_device

  - id: !extend wall_panel_default_page
    device_id: settings_device

  - id: !extend wall_panel_clock_style
    device_id: settings_device

  - id: !extend wall_panel_time_format
    device_id: settings_device

  # ---------------------------------------------------------------------------
  # Display-unit preferences
  # ---------------------------------------------------------------------------
  # These selectors change PRESENTATION ONLY. Home Assistant remains the source
  # of truth. Raw source values stay unchanged, which is important when the panel
  # later sends a value back to Home Assistant.
  #
  # Auto = show the source unit reported by Home Assistant.
  #
  # Forecast values are formatted when weather.get_forecasts returns. Therefore
  # changing temperature or speed unit while the weather page is open must also
  # request a fresh forecast so the five small forecast labels update instantly.

  - platform: template
    id: wall_panel_temperature_unit
    name: "Temperature Unit"
    device_id: settings_device
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "°C", "°F"]
    on_value:
      - script.execute: home_weather_refresh_forecast

  - platform: template
    id: wall_panel_distance_unit
    name: "Distance Unit"
    device_id: settings_device
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "km", "mi"]

  - platform: template
    id: wall_panel_speed_unit
    name: "Speed Unit"
    device_id: settings_device
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "m/s", "km/h", "mph"]
    on_value:
      - script.execute: home_weather_refresh_forecast

  - platform: template
    id: wall_panel_pressure_unit
    name: "Pressure Unit"
    device_id: settings_device
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "hPa", "inHg"]

  # ---------------------------------------------------------------------------
  # Lights
  # ---------------------------------------------------------------------------
  - id: !extend light_slot1_function
    device_id: lights_device
  - id: !extend light_slot2_function
    device_id: lights_device
  - id: !extend light_slot3_function
    device_id: lights_device
  - id: !extend light_slot4_function
    device_id: lights_device

  # ---------------------------------------------------------------------------
  # Scenes
  # ---------------------------------------------------------------------------
  - id: !extend scene_slot1_function
    device_id: scenes_device
  - id: !extend scene_slot2_function
    device_id: scenes_device
  - id: !extend scene_slot3_function
    device_id: scenes_device
  - id: !extend scene_slot4_function
    device_id: scenes_device

number:
  # Screensaver tuning belongs to the Settings child device.
  - id: !extend wall_panel_screensaver_timeout
    device_id: settings_device

  - id: !extend wall_panel_screensaver_brightness
    device_id: settings_device

light:
  # The physical LCD backlight is exposed as a settings control rather than as a
  # room light, hence it is grouped under Settings.
  - id: !extend lcd_backlight
    name: "Backlight"
    device_id: settings_device

text:
  # ---------------------------------------------------------------------------
  # Home
  # User-entered Name and Entity values are intentionally never translated.
  # ---------------------------------------------------------------------------
  - id: !extend home_slot1_name
    device_id: home_device
  - id: !extend home_slot1_entity
    device_id: home_device
  - id: !extend home_slot2_name
    device_id: home_device
  - id: !extend home_slot2_entity
    device_id: home_device
  - id: !extend home_slot3_name
    device_id: home_device
  - id: !extend home_slot3_entity
    device_id: home_device
  - id: !extend home_slot4_name
    device_id: home_device
  - id: !extend home_slot4_entity
    device_id: home_device
  - id: !extend home_slot5_name
    device_id: home_device
  - id: !extend home_slot5_entity
    device_id: home_device
  - id: !extend home_slot6_name
    device_id: home_device
  - id: !extend home_slot6_entity
    device_id: home_device

  # ---------------------------------------------------------------------------
  # Lights
  # ---------------------------------------------------------------------------
  - id: !extend light_slot1_name
    device_id: lights_device
  - id: !extend light_slot1_entity
    device_id: lights_device
  - id: !extend light_slot2_name
    device_id: lights_device
  - id: !extend light_slot2_entity
    device_id: lights_device
  - id: !extend light_slot3_name
    device_id: lights_device
  - id: !extend light_slot3_entity
    device_id: lights_device
  - id: !extend light_slot4_name
    device_id: lights_device
  - id: !extend light_slot4_entity
    device_id: lights_device

  # ---------------------------------------------------------------------------
  # Blinds
  # ---------------------------------------------------------------------------
  - id: !extend cover_slot1_name
    device_id: blinds_device
  - id: !extend cover_slot1_entity
    device_id: blinds_device
  - id: !extend cover_slot2_name
    device_id: blinds_device
  - id: !extend cover_slot2_entity
    device_id: blinds_device
  - id: !extend cover_slot3_name
    device_id: blinds_device
  - id: !extend cover_slot3_entity
    device_id: blinds_device
  - id: !extend cover_slot4_name
    device_id: blinds_device
  - id: !extend cover_slot4_entity
    device_id: blinds_device

  # ---------------------------------------------------------------------------
  # Scenes
  # ---------------------------------------------------------------------------
  - id: !extend scene_slot1_name
    device_id: scenes_device
  - id: !extend scene_slot1_entity
    device_id: scenes_device
  - id: !extend scene_slot2_name
    device_id: scenes_device
  - id: !extend scene_slot2_entity
    device_id: scenes_device
  - id: !extend scene_slot3_name
    device_id: scenes_device
  - id: !extend scene_slot3_entity
    device_id: scenes_device
  - id: !extend scene_slot4_name
    device_id: scenes_device
  - id: !extend scene_slot4_entity
    device_id: scenes_device

switch:
  # Per-light exclusion from the "All off" function.
  - id: !extend light_slot1_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot2_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot3_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot4_ignore_all_off
    device_id: lights_device
