# Home Assistant sub-device organization
#
# The physical wall panel stays as the parent device. Page-specific entities are
# grouped into logical child devices so the Home Assistant device page remains
# easy to navigate.

esphome:
  devices:
    - id: lights_device
      name: "Lights"

    - id: blinds_device
      name: "Blinds"

    - id: audio_device
      name: "Audio"

    - id: scenes_device
      name: "Scenes"

    - id: settings_device
      name: "Settings"

select:
  # Settings
  - id: !extend wall_panel_language
    device_id: settings_device

  - id: !extend wall_panel_rotation
    device_id: settings_device

  - id: !extend wall_panel_default_page
    device_id: settings_device

  - id: !extend wall_panel_clock_style
    device_id: settings_device

  - id: !extend wall_panel_time_format
    device_id: settings_device

  # Lights
  - id: !extend light_slot1_function
    name: "Slot 1 · Function"
    device_id: lights_device

  - id: !extend light_slot2_function
    name: "Slot 2 · Function"
    device_id: lights_device

  - id: !extend light_slot3_function
    name: "Slot 3 · Function"
    device_id: lights_device

  - id: !extend light_slot4_function
    name: "Slot 4 · Function"
    device_id: lights_device

  # Scenes
  - id: !extend scene_slot1_function
    name: "Slot 1 · Function"
    device_id: scenes_device

  - id: !extend scene_slot2_function
    name: "Slot 2 · Function"
    device_id: scenes_device

  - id: !extend scene_slot3_function
    name: "Slot 3 · Function"
    device_id: scenes_device

  - id: !extend scene_slot4_function
    name: "Slot 4 · Function"
    device_id: scenes_device

number:
  - id: !extend wall_panel_screensaver_timeout
    device_id: settings_device

  - id: !extend wall_panel_screensaver_brightness
    device_id: settings_device

light:
  - id: !extend lcd_backlight
    name: "Backlight"
    device_id: settings_device

text:
  # Lights
  - id: !extend light_slot1_name
    name: "Slot 1 · Name"
    device_id: lights_device
  - id: !extend light_slot1_entity
    name: "Slot 1 · Entity"
    device_id: lights_device
  - id: !extend light_slot2_name
    name: "Slot 2 · Name"
    device_id: lights_device
  - id: !extend light_slot2_entity
    name: "Slot 2 · Entity"
    device_id: lights_device
  - id: !extend light_slot3_name
    name: "Slot 3 · Name"
    device_id: lights_device
  - id: !extend light_slot3_entity
    name: "Slot 3 · Entity"
    device_id: lights_device
  - id: !extend light_slot4_name
    name: "Slot 4 · Name"
    device_id: lights_device
  - id: !extend light_slot4_entity
    name: "Slot 4 · Entity"
    device_id: lights_device

  # Blinds
  - id: !extend cover_slot1_name
    name: "Slot 1 · Name"
    device_id: blinds_device
  - id: !extend cover_slot1_entity
    name: "Slot 1 · Entity"
    device_id: blinds_device
  - id: !extend cover_slot2_name
    name: "Slot 2 · Name"
    device_id: blinds_device
  - id: !extend cover_slot2_entity
    name: "Slot 2 · Entity"
    device_id: blinds_device
  - id: !extend cover_slot3_name
    name: "Slot 3 · Name"
    device_id: blinds_device
  - id: !extend cover_slot3_entity
    name: "Slot 3 · Entity"
    device_id: blinds_device
  - id: !extend cover_slot4_name
    name: "Slot 4 · Name"
    device_id: blinds_device
  - id: !extend cover_slot4_entity
    name: "Slot 4 · Entity"
    device_id: blinds_device

  # Scenes
  - id: !extend scene_slot1_name
    name: "Slot 1 · Name"
    device_id: scenes_device
  - id: !extend scene_slot1_entity
    name: "Slot 1 · Entity"
    device_id: scenes_device
  - id: !extend scene_slot1_local_actions
    name: "Slot 1 · Local Actions"
    device_id: scenes_device
  - id: !extend scene_slot2_name
    name: "Slot 2 · Name"
    device_id: scenes_device
  - id: !extend scene_slot2_entity
    name: "Slot 2 · Entity"
    device_id: scenes_device
  - id: !extend scene_slot2_local_actions
    name: "Slot 2 · Local Actions"
    device_id: scenes_device
  - id: !extend scene_slot3_name
    name: "Slot 3 · Name"
    device_id: scenes_device
  - id: !extend scene_slot3_entity
    name: "Slot 3 · Entity"
    device_id: scenes_device
  - id: !extend scene_slot3_local_actions
    name: "Slot 3 · Local Actions"
    device_id: scenes_device
  - id: !extend scene_slot4_name
    name: "Slot 4 · Name"
    device_id: scenes_device
  - id: !extend scene_slot4_entity
    name: "Slot 4 · Entity"
    device_id: scenes_device
  - id: !extend scene_slot4_local_actions
    name: "Slot 4 · Local Actions"
    device_id: scenes_device

