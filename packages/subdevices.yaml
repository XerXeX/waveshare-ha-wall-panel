switch:
  # Per-light exclusion from the "All off" function.
  - id: !extend light_slot1_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot2_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot3_ignore_all_off
    device_id: lights_device
  - id: !extend light_slot4_ignore_all_off
