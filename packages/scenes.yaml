lvgl:
  id: wall_panel_lvgl
  pages:
    - id: scenes_page
      bg_color: 0x101216
      widgets:
        - label:
            id: scenes_page_title
            x: 20
            y: 18
            text: "Scenes"
            text_font: ui_font_34
            text_color: 0xFFFFFF

        - button:
            id: scene_slot1_card
            x: 20
            y: 72
            width: 210
            height: 135
            bg_color: 0x181B20
            radius: 18
            border_width: 0
            hidden: true
            on_click:
              - script.execute: ui_click
              - homeassistant.action:
                  action: homeassistant.turn_on
                  data_template:
                    entity_id: "{{ target_entity }}"
                  variables:
                    target_entity: !lambda return id(scene_slot1_entity).state;
            widgets:
              - image:
                  id: scene_slot1_icon
                  src: icon_palette_outline
                  x: 18
                  y: 18
                  image_recolor: 0xFFB300
                  image_recolor_opa: 100%
