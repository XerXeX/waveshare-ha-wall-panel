# Configurable scenes/scripts page
#
# Each slot exposes Name, Entity and Function settings in Home Assistant.
# scene.* and script.* entities are supported. Entity mode mirrors the Home
# Assistant entity icon when it is available in packages/icons.yaml.

text:
  - platform: template
    id: scene_slot1_name
    name: "Scenes · Slot 1 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Scene 1"
    min_length: 0
    max_length: 32
    mode: text

  - platform: template
    id: scene_slot1_entity
    name: "Scenes · Slot 1 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
