interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto set_text_if_changed = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          auto set_hidden_if_changed = [](lv_obj_t *obj, bool hidden) {
            const bool current = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (current == hidden)
              return;
            if (hidden)
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };

          auto set_geometry_if_changed = [](lv_obj_t *obj, int x, int y, int width) {
            if (lv_obj_get_x(obj) != x || lv_obj_get_y(obj) != y)
              lv_obj_set_pos(obj, x, y);
            if (lv_obj_get_width(obj) != width)
              lv_obj_set_width(obj, width);
          };

          auto icon_image = [](const std::string &icon) -> esphome::image::Image * {
            if (icon == "mdi:home") return id(scene_icon_home);
            if (icon == "mdi:lightbulb") return id(scene_icon_lightbulb);
            if (icon == "mdi:lightbulb-group") return id(scene_icon_lightbulb_group);
            if (icon == "mdi:movie-open") return id(scene_icon_movie);
            if (icon == "mdi:television") return id(scene_icon_television);
            if (icon == "mdi:weather-night") return id(scene_icon_night);
            if (icon == "mdi:weather-sunny") return id(scene_icon_sunny);
            if (icon == "mdi:bed") return id(scene_icon_bed);
            if (icon == "mdi:party-popper") return id(scene_icon_party);
            if (icon == "mdi:music") return id(scene_icon_music);
            if (icon == "mdi:gamepad-variant") return id(scene_icon_gamepad);
            if (icon == "mdi:fireplace") return id(scene_icon_fireplace);
            if (icon == "mdi:coffee") return id(scene_icon_coffee);
            if (icon == "mdi:power") return id(scene_icon_power);
            if (icon == "mdi:shield-home") return id(scene_icon_shield_home);
            if (icon == "mdi:door-open") return id(scene_icon_door_open);
            if (icon == "mdi:door-closed") return id(scene_icon_door_closed);
            if (icon == "mdi:window-shutter") return id(scene_icon_shutter);
            if (icon == "mdi:blinds") return id(scene_icon_blinds);
            if (icon == "mdi:silverware-fork-knife") return id(scene_icon_dining);
            if (icon == "mdi:book-open-page-variant") return id(scene_icon_book);
            if (icon == "mdi:heart") return id(scene_icon_heart);
            if (icon == "mdi:star") return id(scene_icon_star);
            if (icon == "mdi:palette") return id(scene_icon_palette);
            return id(nav_scenes);
          };

          set_text_if_changed(
            id(scenes_page_title),
            id(wall_panel_controller).tr(esphome::wall_panel::TranslationKey::SCENES)
          );

          const std::string names[4] = {
            id(scene_slot1_name).state, id(scene_slot2_name).state,
            id(scene_slot3_name).state, id(scene_slot4_name).state
          };
          const std::string entities[4] = {
            id(scene_slot1_entity).state, id(scene_slot2_entity).state,
            id(scene_slot3_entity).state, id(scene_slot4_entity).state
          };
          const std::string local_actions[4] = {
            id(scene_slot1_local_actions).state, id(scene_slot2_local_actions).state,
            id(scene_slot3_local_actions).state, id(scene_slot4_local_actions).state
          };
          const std::string functions[4] = {
            id(scene_slot1_function).current_option(), id(scene_slot2_function).current_option(),
            id(scene_slot3_function).current_option(), id(scene_slot4_function).current_option()
          };

          for (int i = 0; i < 4; i++)
            id(wall_panel_controller).set_scene_icon_entity(i + 1, functions[i] == "Auto" ? entities[i] : "");

          lv_obj_t *cards[4] = {
            id(scene_slot1_card), id(scene_slot2_card), id(scene_slot3_card), id(scene_slot4_card)
          };
          lv_obj_t *labels[4] = {
            id(scene_slot1_name_label), id(scene_slot2_name_label),
            id(scene_slot3_name_label), id(scene_slot4_name_label)
          };
          lv_obj_t *icons[4] = {
            id(scene_slot1_icon), id(scene_slot2_icon), id(scene_slot3_icon), id(scene_slot4_icon)
          };

          static std::string last_icons[4];
          int visible_indices[4];
          int visible_count = 0;
          for (int i = 0; i < 4; i++) {
            const bool supported_entity = entities[i].rfind("scene.", 0) == 0 || entities[i].rfind("script.", 0) == 0;
            const bool entity_mode = functions[i] == "Auto" && supported_entity;
            const bool local_mode = functions[i] == "Local action" && !local_actions[i].empty();
            const bool visible = functions[i] != "Hidden" && (entity_mode || local_mode);
            set_hidden_if_changed(cards[i], !visible);
            if (visible)
              visible_indices[visible_count++] = i;

            const std::string fallback = "Scene " + std::to_string(i + 1);
            set_text_if_changed(labels[i], names[i].empty() ? fallback : names[i]);

            const std::string inherited_icon = entity_mode ? id(wall_panel_controller).get_scene_icon(i + 1) : "";
            if (last_icons[i] != inherited_icon) {
              last_icons[i] = inherited_icon;
              esphome::lvgl::lv_image_set_src(icons[i], icon_image(inherited_icon));
            }
          }

          for (int rank = 0; rank < visible_count; rank++) {
            const int i = visible_indices[rank];
            if (visible_count <= 2)
              set_geometry_if_changed(cards[i], 20, 72 + rank * 150, 440);
            else
              set_geometry_if_changed(cards[i], rank % 2 == 0 ? 20 : 250, rank < 2 ? 72 : 222, 210);
          }
