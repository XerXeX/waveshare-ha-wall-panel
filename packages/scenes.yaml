interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto set_text_if_changed = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          auto set_hidden_if_changed = [](lv_obj_t *obj, bool hidden) {
            const bool current = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (current == hidden)
              return;
            if (hidden)
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };

          auto set_geometry_if_changed = [](lv_obj_t *obj, int x, int y, int width) {
            if (lv_obj_get_x(obj) != x || lv_obj_get_y(obj) != y)
              lv_obj_set_pos(obj, x, y);
            if (lv_obj_get_width(obj) != width)
              lv_obj_set_width(obj, width);
          };

          // One shared runtime registry is the single source of truth for MDI
          // assets. No duplicated list of icon IDs lives in this page anymore.
          auto icon_image = [&](const std::string &icon) -> esphome::image::Image * {
            if (auto *image = id(wall_panel_controller).get_registered_icon(icon); image != nullptr)
              return image;
            return id(icon_palette_outline);
          };

          set_text_if_changed(id(scenes_page_title), id(wall_panel_language).tr("scenes"));

          const std::string names[4] = {
            id(scene_slot1_name).state, id(scene_slot2_name).state,
            id(scene_slot3_name).state, id(scene_slot4_name).state
          };
          const std::string entities[4] = {
            id(scene_slot1_entity).state, id(scene_slot2_entity).state,
            id(scene_slot3_entity).state, id(scene_slot4_entity).state
          };
          const std::string functions[4] = {
            id(scene_slot1_function).current_option(), id(scene_slot2_function).current_option(),
            id(scene_slot3_function).current_option(), id(scene_slot4_function).current_option()
          };

          for (int i = 0; i < 4; i++)
            id(wall_panel_controller).set_scene_icon_entity(i + 1, functions[i] == "Auto" ? entities[i] : "");

          lv_obj_t *cards[4] = {
            id(scene_slot1_card), id(scene_slot2_card), id(scene_slot3_card), id(scene_slot4_card)
          };
          lv_obj_t *labels[4] = {
            id(scene_slot1_name_label), id(scene_slot2_name_label),
            id(scene_slot3_name_label), id(scene_slot4_name_label)
          };
          lv_obj_t *icons[4] = {
            id(scene_slot1_icon), id(scene_slot2_icon), id(scene_slot3_icon), id(scene_slot4_icon)
          };

          static std::string last_icons[4];
          int visible_indices[4];
          int visible_count = 0;
          for (int i = 0; i < 4; i++) {
            const bool supported_entity = entities[i].rfind("scene.", 0) == 0 || entities[i].rfind("script.", 0) == 0;
            const bool visible = functions[i] != "Hidden" && supported_entity;
            set_hidden_if_changed(cards[i], !visible);
            if (visible)
              visible_indices[visible_count++] = i;

            const std::string fallback = std::string(id(wall_panel_language).tr("scene")) + " " + std::to_string(i + 1);
            set_text_if_changed(labels[i], names[i].empty() ? fallback : names[i]);

            const std::string inherited_icon = visible ? id(wall_panel_controller).get_scene_icon(i + 1) : "";
            if (last_icons[i] != inherited_icon) {
              last_icons[i] = inherited_icon;
              esphome::lvgl::lv_image_set_src(icons[i], icon_image(inherited_icon));
            }
          }

          for (int rank = 0; rank < visible_count; rank++) {
            const int i = visible_indices[rank];
            if (visible_count <= 2)
              set_geometry_if_changed(cards[i], 20, 72 + rank * 150, 440);
            else
              set_geometry_if_changed(cards[i], rank % 2 == 0 ? 20 : 250, rank < 2 ? 72 : 222, 210);
          }
