# Configurable scenes/scripts page
#
# Each slot exposes Name, Entity and Function settings in Home Assistant.
# scene.* and script.* entities are supported. Entity mode mirrors the Home
# Assistant entity icon when it is available in packages/icons.yaml.
#
# ICONS
# -----
# Scene/Script cards do not maintain their own hardcoded MDI lookup table.
# The wall_panel component owns the shared MDI -> image registry, populated from
# packages/icons.yaml. This page only asks the registry for the inherited icon
# and falls back to icon_palette_outline when no matching shared icon exists.

