# Configurable scenes/scripts page
#
# Each slot can either activate a scene/script entity or execute a compact list
# of Home Assistant actions stored directly on the panel. Entity mode mirrors
# the Home Assistant entity icon when it is part of the built-in icon set.

text:
  - platform: template
    id: scene_slot1_name
    name: "Scenes · Slot 1 · 1 Name"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Scene 1"
    min_length: 0
    max_length: 32
    mode: text

  - platform: template
    id: scene_slot1_entity
    name: "Scenes · Slot 1 · 2 Entity"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text

