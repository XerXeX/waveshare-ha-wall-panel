                        y: 47
                        text: ""
                        text_color: 0xB8BDC5
                        text_font: ui_font_18
                    - label:
                        id: home_weather_pressure_value
                        x: 180
                        y: 47
                        width: 238
                        text: "--"
                        text_color: 0xFFFFFF
                        text_align: RIGHT
                        text_font: ui_font_18

                    - label:
                        id: home_weather_wind_name
                        x: 18
                        y: 77
                        text: ""
                        text_color: 0xB8BDC5
                        text_font: ui_font_18
                    - label:
                        id: home_weather_wind_value
                        x: 150
                        y: 77
                        width: 268
                        text: "--"
                        text_color: 0xFFFFFF
                        text_align: RIGHT
                        text_font: ui_font_18

              # Five forecast columns. We sample every second hourly forecast
              # entry, giving +2, +4, +6, +8 and +10 hours.
