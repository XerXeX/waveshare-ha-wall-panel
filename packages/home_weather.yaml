script:
  - id: home_weather_refresh_forecast
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const int active = id(active_home_slot);
              if (active < 1 || active > 6)
                return false;
              const auto &slot = id(wall_panel_controller).get_home_slot(active);
              return slot.available && slot.domain == "weather" && !slot.entity_id.empty();
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  type: hourly
                data_template:
                  entity_id: "{{ weather_entity }}"
                variables:
                  weather_entity: |-
                    const int active = id(active_home_slot);
                    if (active < 1 || active > 6)
                      return std::string();
                    return id(wall_panel_controller).get_home_slot(active).entity_id;
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst action_response = response["response"].as<JsonObjectConst>();
                      if (action_response.isNull())
                        return;

                      std::string response_entity;
                      JsonObjectConst weather_response;
                      for (JsonPairConst pair : action_response) {
                        response_entity = pair.key().c_str();
                        weather_response = pair.value().as<JsonObjectConst>();
                        break;
                      }

                      const int active = id(active_home_slot);
                      if (active < 1 || active > 6 || response_entity.empty())
                        return;
                      const auto &slot = id(wall_panel_controller).get_home_slot(active);
                      if (slot.domain != "weather" || slot.entity_id != response_entity)
                        return;

                      JsonArrayConst forecast = weather_response["forecast"].as<JsonArrayConst>();
                      if (forecast.isNull())
                        return;

                      lv_obj_t *icons[5] = {
                        id(home_weather_forecast_icon_1),
                        id(home_weather_forecast_icon_2),
                        id(home_weather_forecast_icon_3),
                        id(home_weather_forecast_icon_4),
                        id(home_weather_forecast_icon_5)
                      };
                      lv_obj_t *temps[5] = {
                        id(home_weather_forecast_temp_1),
                        id(home_weather_forecast_temp_2),
                        id(home_weather_forecast_temp_3),
                        id(home_weather_forecast_temp_4),
                        id(home_weather_forecast_temp_5)
                      };
                      lv_obj_t *winds[5] = {
                        id(home_weather_forecast_wind_1),
                        id(home_weather_forecast_wind_2),
                        id(home_weather_forecast_wind_3),
                        id(home_weather_forecast_wind_4),
                        id(home_weather_forecast_wind_5)
                      };

                      auto forecast_icon = [&](const std::string &condition) -> esphome::image::Image * {
                        if (condition == "sunny") return id(icon_weather_sunny);
                        if (condition == "clear-night") return id(icon_weather_night);
                        if (condition == "rainy") return id(icon_weather_rainy);
                        if (condition == "pouring") return id(icon_weather_pouring);
                        if (condition == "snowy" || condition == "snowy-rainy") return id(icon_weather_snowy);
                        if (condition == "lightning" || condition == "lightning-rainy") return id(icon_weather_lightning);
                        if (condition == "windy" || condition == "windy-variant") return id(icon_fan);
                        if (condition == "partlycloudy") return id(icon_weather_cloudy);
                        return id(icon_weather_cloudy);
                      };

                      auto wind_to_ms = [](float speed, const std::string &unit) -> float {
                        if (unit == "km/h" || unit == "kmh" || unit == "kph")
                          return speed / 3.6f;
                        if (unit == "mph")
                          return speed * 0.44704f;
                        if (unit == "kn" || unit == "kt" || unit == "knot" || unit == "knots")
                          return speed * 0.514444f;
                        if (unit == "ft/s" || unit == "fps")
                          return speed * 0.3048f;
                        return speed;
                      };

                      for (int i = 0; i < 5; i++) {
                        const size_t forecast_index = 1 + (i * 2);
                        if (forecast_index >= forecast.size()) {
                          esphome::lvgl::lv_image_set_src(icons[i], id(icon_weather_cloudy));
                          lv_label_set_text(temps[i], "--");
                          lv_label_set_text(winds[i], "--");
                          continue;
                        }

                        JsonObjectConst item = forecast[forecast_index].as<JsonObjectConst>();
                        const std::string condition = item["condition"] | "";
                        esphome::lvgl::lv_image_set_src(icons[i], forecast_icon(condition));

                        if (!item["temperature"].isNull()) {
                          char text[24];
                          snprintf(text, sizeof(text), "%.1f%s",
                                   item["temperature"].as<float>(),
                                   slot.unit.empty() ? "°" : slot.unit.c_str());
                          lv_label_set_text(temps[i], text);
                        } else {
                          lv_label_set_text(temps[i], "--");
                        }

                        if (!item["wind_speed"].isNull()) {
                          const float wind_ms = wind_to_ms(item["wind_speed"].as<float>(), slot.wind_speed_unit);
                          char text[24];
                          snprintf(text, sizeof(text), "%.1f m/s", wind_ms);
                          lv_label_set_text(winds[i], text);
                        } else {
                          lv_label_set_text(winds[i], "--");
                        }
                      }

interval:
  - interval: 500ms
    then:
      - lambda: |-
          const int active = id(active_home_slot);
          const bool has_active_slot = active >= 1 && active <= 6;
          const auto &slot = has_active_slot
              ? id(wall_panel_controller).get_home_slot(active)
              : id(wall_panel_controller).get_home_slot(0);
          const bool is_weather = has_active_slot && slot.domain == "weather";

          if (!is_weather) {
            if (!lv_obj_has_flag(id(home_weather_detail_panel), LV_OBJ_FLAG_HIDDEN))
              lv_obj_add_flag(id(home_weather_detail_panel), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          if (lv_obj_has_flag(id(home_weather_detail_panel), LV_OBJ_FLAG_HIDDEN))
            lv_obj_clear_flag(id(home_weather_detail_panel), LV_OBJ_FLAG_HIDDEN);

          static std::string last_forecast_entity;
          static uint32_t last_forecast_refresh = 0;
          const uint32_t now = millis();
          if (slot.entity_id != last_forecast_entity || now - last_forecast_refresh >= 600000UL) {
            last_forecast_entity = slot.entity_id;
            last_forecast_refresh = now;
            id(home_weather_refresh_forecast).execute();
          }

          auto set_label = [](lv_obj_t *label, const std::string &text) {
            const char *current = lv_label_get_text(label);
            if (current == nullptr || text != current)
              lv_label_set_text(label, text.c_str());
          };

          auto condition_text = [&](const std::string &condition) -> std::string {
            const char *key = nullptr;
            if (condition == "sunny") key = "weather_sunny";
            else if (condition == "clear-night") key = "weather_clear_night";
            else if (condition == "cloudy") key = "weather_cloudy";
            else if (condition == "partlycloudy") key = "weather_partlycloudy";
            else if (condition == "fog") key = "weather_fog";
            else if (condition == "hail") key = "weather_hail";
            else if (condition == "lightning") key = "weather_lightning";
            else if (condition == "lightning-rainy") key = "weather_lightning_rainy";
            else if (condition == "pouring") key = "weather_pouring";
            else if (condition == "rainy") key = "weather_rainy";
            else if (condition == "snowy") key = "weather_snowy";
            else if (condition == "snowy-rainy") key = "weather_snowy_rainy";
            else if (condition == "windy" || condition == "windy-variant") key = "weather_windy";
            else if (condition == "exceptional") key = "weather_exceptional";
            return key == nullptr ? condition : std::string(id(wall_panel_language).tr(key));
          };

          auto weather_icon = [&](const esphome::wall_panel::HomeSlotState &item) -> esphome::image::Image * {
            if (auto *custom = id(wall_panel_controller).get_registered_icon(item.icon); custom != nullptr)
              return custom;
            if (item.state == "sunny") return id(icon_weather_sunny);
            if (item.state == "clear-night") return id(icon_weather_night);
            if (item.state == "rainy") return id(icon_weather_rainy);
            if (item.state == "pouring") return id(icon_weather_pouring);
            if (item.state == "snowy" || item.state == "snowy-rainy") return id(icon_weather_snowy);
            if (item.state == "lightning" || item.state == "lightning-rainy") return id(icon_weather_lightning);
            if (item.state == "windy" || item.state == "windy-variant") return id(icon_fan);
            return id(icon_weather_cloudy);
          };

          static esphome::image::Image *last_image = nullptr;
          auto *image = weather_icon(slot);
          if (last_image != image) {
            esphome::lvgl::lv_image_set_src(id(home_weather_detail_icon), image);
            last_image = image;
          }

          set_label(id(home_weather_detail_condition), slot.available ? condition_text(slot.state)
                                                                     : id(wall_panel_language).tr("unavailable"));
          set_label(id(home_weather_humidity_name), id(wall_panel_language).tr("humidity"));
          set_label(id(home_weather_pressure_name), id(wall_panel_language).tr("pressure"));
          set_label(id(home_weather_wind_name), id(wall_panel_language).tr("wind"));

          const std::string hour = id(wall_panel_language).tr("hour_short");
          set_label(id(home_weather_forecast_time_1), "+2" + hour);
          set_label(id(home_weather_forecast_time_2), "+4" + hour);
          set_label(id(home_weather_forecast_time_3), "+6" + hour);
          set_label(id(home_weather_forecast_time_4), "+8" + hour);
          set_label(id(home_weather_forecast_time_5), "+10" + hour);

          if (slot.available && slot.has_wind_speed) {
            if (!slot.wind_bearing.empty()) {
              char *end = nullptr;
              const float bearing = std::strtof(slot.wind_bearing.c_str(), &end);

              if (end != slot.wind_bearing.c_str() && std::isfinite(bearing)) {
                lv_image_set_rotation(
                  id(home_weather_wind_arrow),
                  static_cast<int32_t>(bearing * 10)
                );
              }
            }
          }

          if (slot.available && slot.has_current_temperature) {
            char text[32];
            snprintf(text, sizeof(text), "%.1f%s", slot.current_temperature,
                     slot.unit.empty() ? "°" : slot.unit.c_str());
            set_label(id(home_weather_detail_temperature), text);
          } else {
            set_label(id(home_weather_detail_temperature), "--");
          }

          if (slot.available && slot.has_humidity) {
            char text[24];
            snprintf(text, sizeof(text), "%.0f%%", slot.humidity);
            set_label(id(home_weather_humidity_value), text);
          } else {
            set_label(id(home_weather_humidity_value), "--");
          }

          if (slot.available && slot.has_pressure) {
            char text[40];
            snprintf(text, sizeof(text), "%.1f%s%s", slot.pressure,
                     slot.pressure_unit.empty() ? "" : " ", slot.pressure_unit.c_str());
            set_label(id(home_weather_pressure_value), text);
          } else {
            set_label(id(home_weather_pressure_value), "--");
          }

          if (slot.available && slot.has_wind_speed) {
            auto wind_to_ms = [](float speed, const std::string &unit) -> float {
              if (unit == "km/h" || unit == "kmh" || unit == "kph")
                return speed / 3.6f;
              if (unit == "mph")
                return speed * 0.44704f;
              if (unit == "kn" || unit == "kt" || unit == "knot" || unit == "knots")
                return speed * 0.514444f;
              if (unit == "ft/s" || unit == "fps")
                return speed * 0.3048f;
              return speed;
            };

            char text[32];
            snprintf(text, sizeof(text), "%.1f m/s", wind_to_ms(slot.wind_speed, slot.wind_speed_unit));
            set_label(id(home_weather_wind_value), text);
          } else {
            set_label(id(home_weather_wind_value), "--");
          }
