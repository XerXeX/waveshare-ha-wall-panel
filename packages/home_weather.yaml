# Weather-specific detail view for Home slots
#
# PURPOSE
# -------
# This package overlays the generic Home detail page whenever the selected Home
# slot points at a weather.* entity. Current conditions come from the dynamic
# Home-slot subscriptions in the wall_panel component, while the 10-hour strip is
# fetched on demand with weather.get_forecasts.
#
# LOCALIZATION
# ------------
# User-facing words are never hardcoded in the runtime logic. They are looked up
# through wall_panel_language.tr(...). The English strings used by the widgets
# below are therefore kept to neutral placeholders ("", "--") so a translated
# installation does not briefly flash English before the first refresh.
#
# UNITS
# -----
# Home Assistant remains the source of truth for both values and source units.
# The global selects in packages/units.yaml only affect display formatting:
#   - wall_panel_temperature_unit
#   - wall_panel_speed_unit
#   - wall_panel_pressure_unit
# "Auto" means: show the value exactly in the unit Home Assistant supplied.

lvgl:
  id: wall_panel_lvgl
  pages:
    - id: !extend home_detail_page
      widgets:
        - obj:
            id: home_weather_detail_panel
            x: 0
            y: 74
            width: 480
            height: 316
            bg_color: 0x101216
            bg_opa: 100%
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: false
            scrollable: false
            hidden: true
            widgets:
              # Current-condition icon. The actual image is replaced at runtime
              # from the weather state or a registered custom HA icon.
              - image:
                  id: home_weather_detail_icon
                  src: icon_weather_cloudy
                  x: 28
                  y: 22
                  image_recolor: 0xFFFFFF
                  image_recolor_opa: 100%

              # Current weather condition, localized by the 500 ms refresh below.
              - label:
                  id: home_weather_detail_condition
                  x: 88
                  y: 18
                  width: 225
                  text: "--"
                  text_font: ui_font_28
                  text_color: 0xFFFFFF

              # Wind bearing is a numeric degree value from Home Assistant. The
              # MDI navigation icon points north at 0° and is rotated at runtime.
              - image:
                  id: home_weather_wind_arrow
                  x: 300
                  y: 18
                  src: icon_navigation
                  image_recolor: 0xFFFFFF
                  image_recolor_opa: 100%
                  rotation: 0
                  antialias: true

              - label:
                  id: home_weather_detail_temperature
                  x: 315
                  y: 14
                  width: 140
                  text: "--"
                  text_align: RIGHT
                  text_font: ui_font_34
                  text_color: 0xFFFFFF

              # Current-condition metrics.
              - obj:
                  id: lv_obj_0
                  x: 20
                  y: 74
                  width: 440
                  height: 120
                  bg_color: 0x181B20
                  border_width: 0
                  radius: 16
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - label:
                        id: home_weather_humidity_name
                        x: 18
                        y: 17
                        text: ""
                        text_color: 0xB8BDC5
                        text_font: ui_font_18
                    - label:
