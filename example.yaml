esphome:
  name: waveshare-ha-wall-panel
  friendly_name: Waveshare HA Wall Panel

  on_boot:
    - priority: 900
      then:
        - switch.turn_off: waveshare_buzzer

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  homeassistant_states: true
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

packages:
  hardware: !include packages/hardware.yaml
  ui: !include packages/ui.yaml
  lights: !include packages/lights.yaml
  blinds: !include packages/blinds.yaml
  audio: !include packages/audio.yaml
  scenes: !include packages/scenes.yaml