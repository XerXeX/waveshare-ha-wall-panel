esphome:
  name: waveshare-ha-wall-panel
  friendly_name: Waveshare HA Wall Panel

  on_boot:
    - priority: 900
      then:
        - switch.turn_off: waveshare_buzzer

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  homeassistant_states: true
  homeassistant_services: true
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://XerXeX/waveshare-ha-wall-panel@main
    components:
      - wall_panel
    refresh: 5min

packages:
  wall_panel:
    url: https://github.com/XerXeX/waveshare-ha-wall-panel
    ref: main
    refresh: 5min
    files:
      - packages/hardware.yaml
      - packages/icons.yaml
      - packages/ui.yaml
      - packages/home.yaml
      - packages/lights.yaml
      - packages/blinds.yaml
      - packages/scenes.yaml
      - packages/icon_registry.yaml
      - packages/screensaver.yaml
      - packages/header_clock.yaml
      - packages/subdevices.yaml
